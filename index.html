<!DOCTYPE html>

<head>

<style>

:root{--bg:#020B14;--surface:#051A2A;--brand:#00A3FF;--accent:#00FF88;--text:#EDEDF3;--muted:#9CA3AF;--border:rgba(0,163,255,.22);--border-g:rgba(0,255,136,.35);--glass:rgba(5,26,42,.6);}
*,:after,:before{box-sizing:border-box;border:0 solid transparent;}html,body{margin:0;padding:0;}
body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;min-height:100vh;}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;}
::-webkit-scrollbar{width:6px;height:6px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:rgba(0,163,255,.3);border-radius:3px;}
.orb-layer{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.3;animation:float 22s infinite ease-in-out;}.orb-1{width:420px;height:420px;background:#00A3FF;top:5%;left:5%;}.orb-2{width:360px;height:360px;background:#00FF88;bottom:10%;right:5%;animation-delay:7s;opacity:.2;}.orb-3{width:240px;height:240px;background:#00A3FF;top:55%;left:55%;animation-delay:14s;opacity:.15;}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(26px,-44px) scale(1.07)}66%{transform:translate(-16px,16px) scale(.93)}}
.grid-bg{background-image:linear-gradient(rgba(0,163,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,163,255,.04) 1px,transparent 1px);background-size:50px 50px;}
.tg-brand{background:linear-gradient(135deg,#00A3FF 0%,#66C4FF 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.tg-accent{background:linear-gradient(135deg,#00FF88 0%,#fff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.btn-primary{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#00FF88 0%,#fff 100%);color:#020B14;font-weight:700;border-radius:999px;padding:10px 22px;border:none;cursor:pointer;font-family:'Manrope',sans-serif;font-size:13px;transition:transform .2s,box-shadow .2s;}.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 24px -4px rgba(0,255,136,.5);}
.btn-ghost{display:inline-flex;align-items:center;gap:6px;background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:999px;color:var(--text);font-weight:600;padding:9px 20px;cursor:pointer;font-family:'Manrope',sans-serif;font-size:13px;transition:border-color .2s,background .2s;}.btn-ghost:hover{border-color:var(--border-g);background:rgba(0,163,255,.08);}
.btn-accent{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#00A3FF,#0070cc);color:#fff;font-weight:700;border-radius:999px;padding:10px 22px;border:none;cursor:pointer;font-family:'Manrope',sans-serif;font-size:13px;transition:transform .2s,box-shadow .2s;}.btn-accent:hover{transform:translateY(-1px);box-shadow:0 8px 24px -4px rgba(0,163,255,.5);}
.icon-btn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--glass);border:1px solid var(--border);cursor:pointer;color:var(--muted);font-size:15px;transition:border-color .2s,color .2s,background .2s;}.icon-btn:hover{border-color:var(--brand);color:var(--brand);background:rgba(0,163,255,.08);}.icon-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(0,255,136,.08);}
.home-nav{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;background:rgba(2,11,20,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;}
.home-logo{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;display:flex;align-items:center;gap:10px;}
.home-nav-right{display:flex;align-items:center;gap:10px;}
.home-hero{text-align:center;padding:58px 22px 38px;}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--border);border-radius:999px;padding:7px 16px;font-size:12px;color:var(--muted);margin-bottom:22px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite;}@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.35)}}
.home-title{font-size:clamp(32px,5vw,66px);font-weight:700;line-height:1.06;margin-bottom:12px;}
.home-sub{font-size:clamp(13px,1.8vw,17px);color:var(--muted);max-width:480px;margin:0 auto 32px;line-height:1.7;}
.home-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.home-search-wrap{padding:0 22px 26px;max-width:560px;margin:0 auto;}
.search-wrap{position:relative;}.home-search{width:100%;background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:14px;padding:13px 16px 13px 42px;color:var(--text);font-family:'Manrope',sans-serif;font-size:14px;outline:none;transition:border-color .2s;}.home-search:focus{border-color:var(--accent);}.home-search::placeholder{color:var(--muted);}
.search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;}
.home-body{padding:0 18px 60px;max-width:1060px;margin:0 auto;width:100%;}
.cat-group-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);margin:26px 0 12px;padding-left:4px;}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:9px;margin-bottom:6px;}
.cat-item{background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:13px;padding:15px 11px;cursor:pointer;text-align:center;transition:border-color .25s,transform .25s,box-shadow .25s;display:flex;flex-direction:column;align-items:center;gap:7px;}.cat-item:hover{border-color:var(--border-g);transform:translateY(-3px);box-shadow:0 12px 28px -8px rgba(0,255,136,.18);}
.cat-item i{font-size:20px;color:var(--brand);}.cat-item span{font-size:12px;font-weight:600;color:var(--text);}
.lib-nav{display:flex;align-items:center;gap:10px;padding:11px 16px;background:rgba(2,11,20,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;flex-wrap:wrap;}
.lib-title{font-size:16px;font-weight:700;font-family:'Space Grotesk',sans-serif;}
.lib-body{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;max-width:1200px;margin:0 auto;width:100%;}
.tpl-card{background:var(--glass);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color .25s,transform .25s,box-shadow .25s;}.tpl-card:hover{border-color:var(--border-g);transform:translateY(-4px);box-shadow:0 14px 32px -8px rgba(0,255,136,.2);}
.tpl-thumb{width:100%;display:block;object-fit:cover;}.tpl-thumb-grad{width:100%;display:flex;align-items:center;justify-content:center;position:relative;}
.tpl-info{padding:9px 11px 11px;}.tpl-cat{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--brand);text-transform:uppercase;margin-bottom:3px;}.tpl-name{font-size:13px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.editor-wrap{display:flex;flex-direction:column;height:100vh;overflow:hidden;position:relative;z-index:1;}
.editor-nav{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:8px 12px;background:rgba(2,11,20,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;}
.editor-nav-left{display:flex;align-items:center;gap:7px;}.editor-nav-mid{display:flex;align-items:center;gap:5px;}.editor-nav-right{display:flex;align-items:center;gap:6px;}
.project-name-input{background:transparent;border:none;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;outline:none;width:120px;}
.editor-body{display:flex;flex:1;overflow:hidden;}
.editor-sidebar{width:60px;flex-shrink:0;background:rgba(2,11,20,.92);backdrop-filter:blur(16px);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:3px;overflow-y:auto;}
.sidebar-btn{width:46px;height:46px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--muted);font-size:17px;transition:color .2s,background .2s;border:1px solid transparent;}.sidebar-btn:hover{color:var(--brand);background:rgba(0,163,255,.08);border-color:var(--border);}.sidebar-btn.active{color:var(--accent);background:rgba(0,255,136,.08);border-color:var(--border-g);}.sidebar-btn span{font-size:9px;font-weight:600;line-height:1;}
.canvas-area{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;background:rgba(2,11,20,.5);padding:16px;gap:10px;position:relative;}
.page-strip{display:flex;align-items:center;gap:7px;flex-shrink:0;flex-wrap:wrap;}
.page-chip{padding:6px 13px;border-radius:9px;cursor:pointer;font-size:12px;font-weight:600;background:var(--glass);border:1px solid var(--border);color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap;transition:border-color .2s,color .2s;}.page-chip.active{background:linear-gradient(135deg,#00A3FF,#0070cc);border-color:#00A3FF;color:#fff;}.page-chip:hover:not(.active){border-color:var(--brand);color:var(--text);}
.page-add{padding:6px 13px;border-radius:9px;cursor:pointer;font-size:12px;font-weight:600;background:var(--glass);border:1px dashed var(--border);color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap;transition:border-color .2s,color .2s;}.page-add:hover{border-color:var(--accent);color:var(--accent);}
.canvas-box{position:relative;overflow:hidden;border-radius:10px;box-shadow:0 0 60px rgba(0,0,0,.6),0 0 0 1px rgba(0,163,255,.15);flex-shrink:0;}
.element{position:absolute;cursor:move;user-select:none;touch-action:none;}.element.selected{outline:2px solid var(--accent);outline-offset:2px;}
.resize-handle{position:absolute;width:10px;height:10px;background:#fff;border:2px solid var(--accent);border-radius:2px;cursor:nwse-resize;touch-action:none;z-index:40;}
.rotate-handle{position:absolute;left:50%;top:calc(100% + 14px);transform:translateX(-50%);width:20px;height:20px;background:#fff;border:2px solid var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;z-index:40;}
.grid-overlay{position:absolute;inset:0;pointer-events:none;z-index:30;background-image:linear-gradient(rgba(0,255,136,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,136,.12) 1px,transparent 1px);background-size:40px 40px;}
.props-panel{width:248px;flex-shrink:0;background:rgba(2,11,20,.92);backdrop-filter:blur(16px);border-left:1px solid var(--border);overflow-y:auto;padding:13px;display:flex;flex-direction:column;gap:11px;}
.props-label{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--brand);text-transform:uppercase;margin-bottom:5px;}
.props-section{display:flex;flex-direction:column;gap:5px;}
.props-row{display:flex;align-items:center;gap:5px;}
.props-input{flex:1;background:var(--glass);border:1px solid var(--border);border-radius:8px;padding:6px 9px;color:var(--text);font-family:'Manrope',sans-serif;font-size:12px;outline:none;transition:border-color .2s;}.props-input:focus{border-color:var(--accent);}
.props-select{width:100%;background:var(--glass);border:1px solid var(--border);border-radius:8px;padding:6px 9px;color:var(--text);font-family:'Manrope',sans-serif;font-size:12px;outline:none;}.props-select option{background:#051A2A;}
.color-row{display:flex;gap:5px;flex-wrap:wrap;}
.color-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .15s,transform .15s;flex-shrink:0;}.color-dot:hover{transform:scale(1.15);border-color:rgba(255,255,255,.5);}.color-dot.active{border-color:#fff;}
.layers-panel{position:absolute;bottom:0;left:60px;right:248px;background:rgba(2,11,20,.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);border-radius:13px 13px 0 0;padding:13px;z-index:40;max-height:48vh;overflow-y:auto;}
.layer-row{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:9px;cursor:pointer;transition:background .15s;}.layer-row:hover{background:rgba(0,163,255,.08);}.layer-row.active{background:rgba(0,255,136,.08);border:1px solid var(--border-g);}
.layer-icon{font-size:13px;color:var(--muted);width:16px;text-align:center;}.layer-name{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.layer-actions{display:flex;gap:3px;}.layer-action{font-size:12px;color:var(--muted);cursor:pointer;padding:3px 5px;border-radius:5px;transition:color .15s;}.layer-action:hover{color:var(--text);}
.add-panel{position:absolute;bottom:0;left:60px;right:0;background:rgba(2,11,20,.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);border-radius:13px 13px 0 0;padding:13px;z-index:45;max-height:52vh;overflow-y:auto;}
.add-panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;}
.add-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;}
.add-item{background:var(--glass);border:1px solid var(--border);border-radius:11px;padding:12px 7px;cursor:pointer;text-align:center;transition:border-color .2s,transform .2s;display:flex;flex-direction:column;align-items:center;gap:5px;}.add-item:hover{border-color:var(--border-g);transform:translateY(-2px);}.add-item i{font-size:18px;color:var(--brand);}.add-item span{font-size:11px;font-weight:600;color:var(--text);}
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:rgba(5,26,42,.95);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:12px;padding:10px 20px;font-size:13px;font-weight:600;color:var(--text);z-index:9999;pointer-events:none;white-space:nowrap;animation:toastIn .3s ease;}@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.present-wrap{position:relative;z-index:1;min-height:calc(100vh - 56px);display:flex;flex-direction:column;align-items:center;padding:26px 18px;}
.present-canvas{border-radius:13px;box-shadow:0 0 80px rgba(0,163,255,.18),0 0 0 1px rgba(0,163,255,.15);overflow:hidden;position:relative;}
.bottom-nav{display:flex;align-items:stretch;background:rgba(2,11,20,.92);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);flex-shrink:0;z-index:60;}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 4px;cursor:pointer;color:var(--muted);transition:color .2s;border:none;background:transparent;}.bnav-item i{font-size:18px;}.bnav-item span{font-size:10px;font-weight:600;}.bnav-item.active{color:var(--accent);}.bnav-item:hover:not(.active){color:var(--text);}
.drawer-overlay{position:fixed;inset:0;background:rgba(2,11,20,.6);backdrop-filter:blur(4px);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s ease;}.drawer-overlay.open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;left:0;bottom:0;width:270px;max-width:82vw;background:rgba(2,11,20,.97);backdrop-filter:blur(24px);border-right:1px solid var(--border);z-index:201;transform:translateX(-100%);transition:transform .3s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;box-shadow:8px 0 40px rgba(0,0,0,.4);}.drawer.open{transform:translateX(0);}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:20px 16px 16px;border-bottom:1px solid var(--border);}
.drawer-body{flex:1;overflow-y:auto;padding:10px 9px;}
.drawer-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:13px 12px 7px;}
.drawer-item{display:flex;align-items:center;gap:13px;padding:11px 13px;border-radius:11px;cursor:pointer;color:var(--text);font-size:13px;font-weight:600;transition:background .18s,color .18s;border:1px solid transparent;}.drawer-item i{width:18px;text-align:center;font-size:15px;color:var(--brand);}.drawer-item:hover{background:rgba(0,163,255,.08);border-color:var(--border);}.drawer-item.active{background:rgba(0,255,136,.08);border-color:var(--border-g);color:var(--accent);}.drawer-item.active i{color:var(--accent);}
.drawer-foot{padding:13px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);}
.text-toolbar{display:flex;align-items:center;gap:5px;overflow-x:auto;padding:9px 12px;background:rgba(2,11,20,.92);backdrop-filter:blur(20px);border-top:1px solid var(--border);flex-shrink:0;}
.tb-sep{width:1px;height:22px;background:var(--border);flex-shrink:0;}
.tb-btn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;color:var(--muted);background:var(--glass);border:1px solid var(--border);transition:border-color .2s,color .2s;}.tb-btn:hover{border-color:var(--brand);color:var(--brand);}.tb-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(0,255,136,.08);}
.tb-select{height:32px;padding:0 7px;border-radius:8px;background:var(--glass);border:1px solid var(--border);color:var(--text);font-family:'Manrope',sans-serif;font-size:12px;outline:none;}.tb-select option{background:#051A2A;}
.tb-size{display:flex;align-items:center;}.tb-size button{width:26px;height:32px;background:var(--glass);border:1px solid var(--border);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;}.tb-size button:first-child{border-radius:7px 0 0 7px;border-right:none;}.tb-size button:last-child{border-radius:0 7px 7px 0;border-left:none;}.tb-size span{height:32px;min-width:30px;display:flex;align-items:center;justify-content:center;background:var(--glass);border-top:1px solid var(--border);border-bottom:1px solid var(--border);font-size:12px;font-weight:600;}
input[type=range]{accent-color:var(--accent);}
input[type=color]{width:26px;height:26px;padding:2px;border-radius:6px;border:1px solid var(--border);background:var(--glass);cursor:pointer;}

</style>
</head>

<div class="orb-layer">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>
<div id="root"></div>

function bgTypeFor(category, i) {
  const v = CATEGORY_BG[category] || 'photo';
  return Array.isArray(v)? v[i % v.length] : v;
}

function snapToGuides(val, others, threshold=6) {
  for (const o of others) {
    if (Math.abs(val - o) <= threshold) return o;
  }
  return undefined;
}

function getMyColors() {
  try { return JSON.parse(localStorage.getItem('voltara_v26_mycolors')||'[]'); } catch(e){ return []; }
}
function saveMyColor(c) {
  const prev=getMyColors();
  if(prev.includes(c)) return;
  try { localStorage.setItem('voltara_v26_mycolors', JSON.stringify([c,...prev].slice(0,16))); } catch(e){}
}
function removeMyColor(c) {
  try { localStorage.setItem('voltara_v26_mycolors', JSON.stringify(getMyColors().filter(x=>x!==c))); } catch(e){}
}

function formatDims(category) {
  const key = (CATEGORY_META[category] && CATEGORY_META[category].format) || 'square';
  return FORMATS[key] || FORMATS.square;
}

function buildCenteredLayout(dims, title, subtitle, accentColor, textColor, titleFont, textShadow, shapeShadow) {
  const titleSize = Math.max(20, Math.round(dims.w * 0.065));
  const titleWidth = Math.round(dims.w * 0.74);
  const titleHeight = Math.max(Math.round(dims.h * 0.16), Math.round(titleSize * 2.4));
  const titleX = Math.round((dims.w - titleWidth) / 2);
  const titleY = Math.round(dims.h * 0.32);

  const ruleWidth = Math.round(dims.w * 0.12);
  const ruleHeight = Math.max(3, Math.round(dims.h * 0.006));
  const ruleX = Math.round((dims.w - ruleWidth) / 2);
  const ruleY = titleY + titleHeight + Math.round(dims.h * 0.02);

  const subSize = Math.max(13, Math.round(dims.w * 0.028));
  const subWidth = Math.round(dims.w * 0.66);
  const subHeight = Math.max(Math.round(dims.h * 0.08), Math.round(subSize * 2.4));
  const subX = Math.round((dims.w - subWidth) / 2);
  const subY = ruleY + ruleHeight + Math.round(dims.h * 0.025);

  return [
    { id: Date.now() + 1, type: 'text', content: title, x: titleX, y: titleY, width: titleWidth, height: titleHeight, rotation: 0, size: titleSize, color: textColor, fontWeight: '700', fontStyle: 'normal', fontFamily: titleFont, textAlign: 'center', textShadow: textShadow, visible: true },
    { id: Date.now() + 2, type: 'shape', shape: 'rect', x: ruleX, y: ruleY, width: ruleWidth, height: ruleHeight, rotation: 0, color: accentColor, boxShadow: shapeShadow, visible: true },
    subtitle? { id: Date.now() + 3, type: 'text', content: subtitle, x: subX, y: subY, width: subWidth, height: subHeight, rotation: 0, size: subSize, color: textColor, fontWeight: '400', fontStyle: 'normal', fontFamily: TPL_FONT, textAlign: 'center', textShadow: textShadow, visible: true } : null
  ].filter(Boolean);
}

function buildBannerLayout(dims, title, subtitle, accentColor, textColor, titleFont, textShadow, shapeShadow) {
  const titleSize = Math.max(18, Math.round(Math.min(dims.w * 0.055, dims.h * 0.13)));

  const titleX = Math.round(dims.w * 0.09);
  const titleHeight = Math.max(Math.round(titleSize * 2.1), 32);

  const subSize = Math.max(12, Math.round(Math.min(dims.w * 0.026, dims.h * 0.065)));
  const subWidth = titleWidth;
  const subX = titleX;
  const subHeight = subtitle? Math.max(Math.round(subSize * 2), 22) : 0;

  const padTop = Math.round(dims.h * 0.04);
  const padMid = subtitle? Math.round(dims.h * 0.02) : 0;

  const bandHeight = padTop + titleHeight + padMid + subHeight + padBottom;
  const bandY = dims.h - bandHeight;
  const titleY = bandY + padTop;
  const subY = titleY + titleHeight + padMid;

  return [
    { id: Date.now() + 1, type: 'shape', shape: 'rect', radius: '20px 20px 0 0', x: 0, y: bandY, width: dims.w, height: bandHeight, rotation: 0, color: accentColor, boxShadow: shapeShadow, visible: true },

function buildLogoLayout(dims, title, subtitle, accentColor, textColor, titleFont, textShadow, shapeShadow) {
  const circleSize = Math.round(dims.w * 0.34);
  const circleX = Math.round((dims.w - circleSize) / 2);
  const circleY = Math.round(dims.h * 0.18);

  const titleSize = Math.max(20, Math.round(dims.w * 0.075));
  const titleWidth = Math.round(dims.w * 0.82);
  const titleHeight = Math.max(Math.round(dims.h * 0.18), Math.round(titleSize * 2.4));
  const titleX = Math.round((dims.w - titleWidth) / 2);
  const titleY = circleY + circleSize + Math.round(dims.h * 0.06);

  return [
    { id: Date.now() + 1, type: 'shape', shape: 'circle', x: circleX, y: circleY, width: circleSize, height: circleSize, rotation: 0, color: accentColor, boxShadow: shapeShadow, visible: true },
    { id: Date.now() + 2, type: 'text', content: title, x: titleX, y: titleY, width: titleWidth, height: titleHeight, rotation: 0, size: titleSize, color: textColor, fontWeight: '700', fontStyle: 'normal', fontFamily: titleFont, textAlign: 'center', letterSpacing: '0.02em', textShadow: textShadow, visible: true }

function buildResumeLayout(dims, title, subtitle, accentColor, textColor, titleFont, textShadow, shapeShadow) {
  const avatarSize = Math.round(dims.w * 0.16);
  const avatarX = Math.round((dims.w - avatarSize) / 2);
  const avatarY = Math.round(dims.h * 0.05);

  const nameSize = Math.max(18, Math.round(dims.w * 0.062));
  const nameWidth = Math.round(dims.w * 0.84);
  const nameHeight = Math.max(Math.round(dims.h * 0.06), Math.round(nameSize * 1.6));
  const nameX = Math.round((dims.w - nameWidth) / 2);
  const nameY = avatarY + avatarSize + Math.round(dims.h * 0.025);

  const roleSize = Math.max(12, Math.round(dims.w * 0.032));
  const roleWidth = nameWidth;
  const roleHeight = Math.max(Math.round(dims.h * 0.035), Math.round(roleSize * 1.6));
  const roleX = nameX;
  const roleY = nameY + nameHeight + Math.round(dims.h * 0.006);

  const ruleWidth = Math.round(dims.w * 0.7);
  const ruleX = Math.round((dims.w - ruleWidth) / 2);
  const ruleHeight = Math.max(2, Math.round(dims.h * 0.003));
  const ruleY = roleY + roleHeight + Math.round(dims.h * 0.03);

  const sectionX = Math.round(dims.w * 0.12);
  const sectionWidth = Math.round(dims.w * 0.76);
  const headingSize = Math.max(11, Math.round(dims.w * 0.026));
  const headingHeight = Math.round(headingSize * 1.8);
  const bodySize = Math.max(10, Math.round(dims.w * 0.022));
  const bodyLineHeight = Math.round(bodySize * 1.7);
  const gapAfterHeading = Math.round(dims.h * 0.012);
  const gapBetweenSections = Math.round(dims.h * 0.028);

  const sections = [
    { heading: 'EXPERIENCIA', lines: ['Empresa Creativa S.A. — 2022 a la fecha', 'Estudio Profesional CR — 2019 a 2022'] },
    { heading: 'EDUCACIÓN', lines: ['Universidad de Costa Rica — Licenciatura'] },
    { heading: 'HABILIDADES', lines: ['Trabajo en equipo, comunicación, liderazgo'] }
  ];

  const elements = [
    { id: Date.now() + 1, type: 'shape', shape: 'circle', x: avatarX, y: avatarY, width: avatarSize, height: avatarSize, rotation: 0, color: accentColor, boxShadow: shapeShadow, visible: true },
    { id: Date.now() + 2, type: 'text', content: title, x: nameX, y: nameY, width: nameWidth, height: nameHeight, rotation: 0, size: nameSize, color: textColor, fontWeight: '700', fontStyle: 'normal', fontFamily: titleFont, textAlign: 'center', textShadow: textShadow, visible: true },
    { id: Date.now() + 3, type: 'text', content: subtitle, x: roleX, y: roleY, width: roleWidth, height: roleHeight, rotation: 0, size: roleSize, color: accentColor, fontWeight: '600', fontStyle: 'normal', fontFamily: TPL_FONT, textAlign: 'center', textShadow: 'none', visible: true },
    { id: Date.now() + 4, type: 'shape', shape: 'rect', radius: '2px', x: ruleX, y: ruleY, width: ruleWidth, height: ruleHeight, rotation: 0, color: accentColor, boxShadow: 'none', visible: true }
  ];

  let cursorY = ruleY + ruleHeight + Math.round(dims.h * 0.035);
  let idSeq = 5;
  sections.forEach(sec => {
    elements.push({ id: Date.now() + idSeq++, type: 'text', content: sec.heading, x: sectionX, y: cursorY, width: sectionWidth, height: headingHeight, rotation: 0, size: headingSize, color: accentColor, fontWeight: '700', fontStyle: 'normal', fontFamily: TPL_FONT, textAlign: 'left', letterSpacing: '0.08em', textShadow: 'none', visible: true });
    cursorY += headingHeight + gapAfterHeading;
    sec.lines.forEach(line => {
      elements.push({ id: Date.now() + idSeq++, type: 'text', content: line, x: sectionX, y: cursorY, width: sectionWidth, height: bodyLineHeight, rotation: 0, size: bodySize, color: textColor, fontWeight: '400', fontStyle: 'normal', fontFamily: TPL_FONT, textAlign: 'left', textShadow: 'none', visible: true });
      cursorY += bodyLineHeight;
    });
    cursorY += gapBetweenSections;
  });

  return elements;
}

function buildTemplateElements(category, layout, title, subtitle, accentColor, textColor, bgType) {

  const shapeShadow = '0 4px 14px rgba(0,0,0,0.18)';
  if (layout === 'badge') return buildBadgeLayout(dims, title, subtitle, meta.badge || '', accentColor, textColor, titleFont, textShadow, shapeShadow);
  if (layout === 'card') return buildCardLayout(dims, title, subtitle, accentColor, textColor, titleFont, textShadow, shapeShadow);
  if (layout === 'bigType') return buildBigTypeLayout(dims, title, subtitle, accentColor, textColor, titleFont, textShadow, shapeShadow);
  if (layout === 'banner') return buildBannerLayout(dims, title, subtitle, accentColor, textColor, titleFont, textShadow, shapeShadow);

function getDesignColors(elements) {
  const seen=new Set(),cols=[];
  for(const el of elements){const c=el.color;if(c&&!seen.has(c)){seen.add(c);cols.push(c);}}
  return cols.slice(0,8);
}

function isBgLight(bg) {
  if (!bg) return false;
  if (bg.startsWith('#')) {
    const hex=bg.replace(/^#/,'');
    const r=parseInt(hex.substr(0,2)||'0',16);
    const g=parseInt(hex.substr(2,2)||'0',16);
    const b=parseInt(hex.substr(4,2)||'0',16);
    return (r*299+g*587+b*114)/1000 > 180;
  }
  return /fff|white|faf|fef3/.test(bg);
}
function matchFilter(tpl, q) {
  if (!q) return true;
  const lo = q.toLowerCase();
  const lbl = ((CATEGORY_META[tpl.category]&&CATEGORY_META[tpl.category].label)||'').toLowerCase();

  return tpl.category.toLowerCase().includes(lo)||lbl.includes(lo)||tc.includes(lo)||sc.includes(lo);
}

function ElFrame({el,isSelected,onDragStart,onResizeStart,onRotateStart,onEditText}) {
  const s = {

  if (el.type==='text') {

    content = React.createElement('div',{style:{
      width:'100%',height:'100%',display:'flex',alignItems:'center',

  }
  return React.createElement('div',{

  const [slideContentValue, setSlideContentValue] = useState('');

  // Auto-cargar al inicio
  useEffect(() => {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const data = JSON.parse(saved);
        if (data.pages && data.pages.length) {
          setPagesRaw(data.pages);
          setProjectName(data.projectName || 'Mi diseño');
          setPageIdx(0);
          setHistory([]); setFuture([]);
        }
      }
    } catch(e) {}
  }, []);

  // Auto-guardar cuando pages cambia (debounced 1.5s)
  const saveTimer = useRef(null);
  useEffect(() => {
    if (!pages.length) return;
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      try {
        // No guardar las imágenes base64 grandes para no saturar localStorage
        const pagesLight = pages.map(p => ({
          ...p,
          elements: p.elements.map(e => e.type === 'image' ? {...e, src: '[img]'} : e)
        }));
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ pages: pagesLight, projectName }));
      } catch(e) {}
    }, 1500);
    return () => clearTimeout(saveTimer.current);
  }, [pages, projectName]);

  const page     = pages[pageIdx] || null;
  const dims     = page ? formatDims(page.category || 'instagram') : FORMATS.square;
  const elements = page ? page.elements : [];
  const selEl    = elements.find(e => e.id === selId);

  function showToast(msg) { setToastMsg(msg); setTimeout(() => setToastMsg(null), 2400); }

  function setPages(next) {
    setPagesRaw(prev => {
      const ns = typeof next === 'function' ? next(prev) : next;
      if (!isTransactingRef.current) {
        setHistory(h => [...h.slice(-49), prev]);
        setFuture([]);
      } else if (!transactionSnapshotRef.current) {
        transactionSnapshotRef.current = prev;
      }
      return ns;
    });
  }
  function beginTransaction() {
    isTransactingRef.current = true;
    transactionSnapshotRef.current = null;
  }
  function endTransaction() {
    if (transactionSnapshotRef.current) {
      const snap = transactionSnapshotRef.current;
      setHistory(h => [...h.slice(-49), snap]);
      setFuture([]);
    }
    isTransactingRef.current = false;
    transactionSnapshotRef.current = null;
  }
  function undo() {
    setHistory(h => {
      if (!h.length) return h;
      const prev = h[h.length - 1];
      setPagesRaw(cur => { setFuture(f => [cur, ...f.slice(0,49)]); return prev; });
      return h.slice(0,-1);
    });
    setSelId(null);
  }
  function redo() {
    setFuture(f => {
      if (!f.length) return f;
      const next = f[0];
      setPagesRaw(cur => { setHistory(h => [...h.slice(-49), cur]); return next; });
      return f.slice(1);
    });
    setSelId(null);
  }
  function updPage(fn) { setPages(ps => ps.map((p,i) => i===pageIdx ? fn(p) : p)); }
  function updEl(id, updates) { updPage(p => ({...p, elements:p.elements.map(e => e.id===id ? {...e,...updates} : e)})); }
  function addEl(el) { updPage(p => ({...p, elements:[...p.elements, el]})); setSelId(el.id); }
  function delEl(id) { updPage(p => ({...p, elements:p.elements.filter(e => e.id!==id)})); if(selId===id) setSelId(null); }
  function toggleVisible(id) {
    const cur = elements.find(e=>e.id===id);
    updEl(id, {visible: cur?.visible===false ? true : false});
  }
  function moveLayer(id, dir) {
    updPage(p => {
      const arr=[...p.elements], i=arr.findIndex(e=>e.id===id), ni=dir==='up'?i+1:i-1;
      if(ni<0||ni>=arr.length) return p;
      [arr[i],arr[ni]]=[arr[ni],arr[i]];
      return {...p,elements:arr};
    });
  }

  function openTemplate(tpl) {
    const d = formatDims(tpl.category);

      elements:buildTemplateElements(tpl.category,tpl.layout,tpl.title,tpl.subtitle,tpl.accent,tpl.textColor,tpl.bgType)}]);
    setHistory([]); setFuture([]);
    setPageIdx(0); setSelId(null);
    const newName = tpl.title.replace(/\n/g,' ').substring(0,26);
    setProjectName(newName);
    try {
      const prev=JSON.parse(localStorage.getItem('voltara_v26_recent')||'[]');
      const entry={id:Date.now(),name:newName,thumb:tpl.bgType==='photo'?tpl.thumb:tpl.bg,category:tpl.category,ts:Date.now()};
      localStorage.setItem('voltara_v26_recent',JSON.stringify([entry,...prev.filter(r=>r.name!==newName)].slice(0,5)));

  useEffect(()=>{
    function onMove(e) {
      if(!dragRef.current||!canvasRef.current) return;
      const d=dragRef.current, rect=canvasRef.current.getBoundingClientRect();

      const cy=e.touches?e.touches[0].clientY:e.clientY;
      if(d.type==='move') {
        if(!d.began){d.began=true;beginTransaction();}
        updEl(d.id,{x:Math.round((cx-rect.left)/zoom-d.startX),y:Math.round((cy-rect.top)/zoom-d.startY)});
      } else if(d.type==='resize') {
        if(!d.began){d.began=true;beginTransaction();}
        const dx=(cx-rect.left-d.startX)/zoom, dy=(cy-rect.top-d.startY)/zoom, MIN=20;
        let {x,y,width,height}=d.startEl;
        if(d.handle.includes('e')) width=Math.max(MIN,d.startEl.width+dx);
        if(d.handle.includes('w')) {width=Math.max(MIN,d.startEl.width-dx);x=d.startEl.x+d.startEl.width-width;}
        if(d.handle.includes('s')) height=Math.max(MIN,d.startEl.height+dy);
        if(d.handle.includes('n')) {height=Math.max(MIN,d.startEl.height-dy);y=d.startEl.y+d.startEl.height-height;}
        updEl(d.id,{x:Math.round(x),y:Math.round(y),width:Math.round(width),height:Math.round(height)});
      } else if(d.type==='rotate') {
        if(!d.began){d.began=true;beginTransaction();}
        updEl(d.id,{rotation:Math.round(Math.atan2(cy-d.cy,cx-d.cx)*180/Math.PI+90)});
      }
    }
    function onUp(){if(dragRef.current&&dragRef.current.began)endTransaction();dragRef.current=null;}
    let pinchStartDist=0, pinchStartZoom=0;
    function onTouchStart(e){if(e.touches.length===2){pinchStartDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);pinchStartZoom=zoom;dragRef.current=null;}}
    function onTouchMove(e){
      if(e.touches.length===2&&pinchStartDist>0){e.preventDefault();const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);setZoom(Math.max(0.1,Math.min(2,parseFloat((pinchStartZoom*d/pinchStartDist).toFixed(2)))));}
      else{onMove(e);}
    }
    function onTouchEnd(e){if(e.touches.length<2)pinchStartDist=0;onUp(e);}

    window.addEventListener('touchend',onTouchEnd);

  async function renderToCanvas(pg) {
    const d=formatDims(pg.category||'instagram');
    const cv=document.createElement('canvas');cv.width=d.w;cv.height=d.h;
    const ctx=cv.getContext('2d');
    const bg=pg.background;
    if(bg&&bg.startsWith('http')){try{const bi=await loadImg(bg);ctx.drawImage(bi,0,0,d.w,d.h);}catch(e){ctx.fillStyle='#0b0e13';ctx.fillRect(0,0,d.w,d.h);}}
    else if(bg&&bg.includes('gradient')){const g=ctx.createLinearGradient(0,0,d.w,d.h);const ms=bg.match(/#[0-9a-fA-F]{3,8}/g)||['#1a1f26','#0b0e13'];g.addColorStop(0,ms[0]);g.addColorStop(1,ms[ms.length-1]);ctx.fillStyle=g;ctx.fillRect(0,0,d.w,d.h);}
    else{ctx.fillStyle=bg||'#0b0e13';ctx.fillRect(0,0,d.w,d.h);}
    for(const el of pg.elements){
      if(el.visible===false) continue;
      ctx.save();
      ctx.translate(el.x+el.width/2,el.y+el.height/2);ctx.rotate((el.rotation||0)*Math.PI/180);ctx.translate(-el.width/2,-el.height/2);
      if(el.type==='text'){
        ctx.globalAlpha=el.opacity!==undefined?el.opacity:1;
        ctx.fillStyle=el.color||'#fff';
        const fam=(el.fontFamily||'sans-serif').replace(/'/g,'');
        ctx.font=`${el.fontStyle||'normal'} ${el.fontWeight||'400'} ${el.size}px ${fam}`;
        ctx.textBaseline='middle';ctx.textAlign=el.textAlign==='left'?'left':el.textAlign==='right'?'right':'center';
        if(el.textShadow&&el.textShadow!=='none'){ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=4;ctx.shadowOffsetX=1;ctx.shadowOffsetY=1;}
        const lines=String(el.content).split('\n');const lh=el.size*1.2;
        let ty=el.height/2-lines.length*lh/2+lh/2;
        const tx=el.textAlign==='left'?6:el.textAlign==='right'?el.width-6:el.width/2;
        for(const ln of lines){ctx.fillText(ln,tx,ty);ty+=lh;}
      } else if(el.type==='shape'){
        ctx.fillStyle=el.color||'#00A3FF';
        if(el.shape==='circle'){ctx.beginPath();ctx.ellipse(el.width/2,el.height/2,el.width/2,el.height/2,0,0,Math.PI*2);ctx.fill();}
        else if(el.shape==='triangle'){ctx.beginPath();ctx.moveTo(el.width/2,0);ctx.lineTo(0,el.height);ctx.lineTo(el.width,el.height);ctx.closePath();ctx.fill();}
        else if(el.shape==='diamond'){ctx.beginPath();ctx.moveTo(el.width/2,0);ctx.lineTo(el.width,el.height/2);ctx.lineTo(el.width/2,el.height);ctx.lineTo(0,el.height/2);ctx.closePath();ctx.fill();}
        else{const r=parseFloat(el.radius)||0;ctx.beginPath();ctx.moveTo(r,0);ctx.arcTo(el.width,0,el.width,el.height,r);ctx.arcTo(el.width,el.height,0,el.height,r);ctx.arcTo(0,el.height,0,0,r);ctx.arcTo(0,0,el.width,0,r);ctx.closePath();ctx.fill();}
      } else if(el.type==='image'&&el.src){try{const im=await loadImg(el.src);ctx.drawImage(im,0,0,el.width,el.height);}catch(e){}}
      ctx.restore();
    }
    return cv;
  }

  async function exportPDF(allPages=false){
    if(!page)return;
    const pagesToExport = allPages ? pages : [page];
    showToast(pagesToExport.length>1?`Generando PDF con ${pagesToExport.length} páginas...`:'Generando PDF...');
    try{

      const first=pagesToExport[0];
      const fd=formatDims(first.category||'instagram');
      const orient=fd.w>=fd.h?'l':'p';
      const pdf=new jsPDF({orientation:orient,unit:'px',format:[fd.w,fd.h]});
      for(let i=0;i<pagesToExport.length;i++){
        const pg=pagesToExport[i];
        const d=formatDims(pg.category||'instagram');
        if(i>0){
          const po=d.w>=d.h?'l':'p';
          pdf.addPage([d.w,d.h],po);

        const cv=await renderToCanvas(pg);
        const img=cv.toDataURL('image/jpeg',.92);

      pdf.save(`${projectName||'voltara'}.pdf`);
      showToast(pagesToExport.length>1?`✓ PDF con ${pagesToExport.length} páginas descargado`:'¡PDF descargado!');
    }catch(e){showToast('Error al exportar PDF');}
  }
