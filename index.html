:root {
  --voltara-orange: #ea580c;
  --voltara-green: #16a34a;
  --voltara-gray-50: #f6f7f8;
  --voltara-gray-100: #eff1f3;
  --voltara-border: #ebecf0;
  --voltara-text: #0e1318;
  --voltara-text-secondary: #6b7b8a;
}

body {
  background:
    radial-gradient(circle at 12% 18%, rgba(234,88,12,0.30), transparent 42%),
    radial-gradient(circle at 88% 12%, rgba(22,163,74,0.22), transparent 40%),
    radial-gradient(circle at 80% 85%, rgba(22,163,74,0.28), transparent 45%),
    radial-gradient(circle at 10% 90%, rgba(234,88,12,0.18), transparent 40%),
    linear-gradient(135deg, #fff7ed 0%, #fefce8 50%, #f0fdf4 100%);
  background-attachment: fixed;
  min-height: 100vh;
}

.canvas-container {
  background-size: cover;
  background-position: center;
  box-shadow: none;
  position: relative;
  overflow: hidden;
  border-radius: 8px;

<body class="text-[#0e1318]">
<div id="root"></div>

<script>
const { useState, useRef, useEffect } = React;

const FORMATS = {
  square:   { w: 640, h: 640 },
  story:    { w: 400, h: 711 },
  wide:     { w: 960, h: 540 },
  card:     { w: 700, h: 400 },
  portrait: { w: 500, h: 700 },
  cover:    { w: 820, h: 310 }
};

const CATEGORY_META = {
  instagram:    { label: 'Publicación Instagram', icon: 'fa-table-cells', format: 'square' },
  historia:     { label: 'Historias', icon: 'fa-mobile-screen', format: 'story' },
  presentations:{ label: 'Presentaciones', icon: 'fa-display', format: 'wide' },
  poster:       { label: 'Posters', icon: 'fa-image', format: 'portrait' },
  card:         { label: 'Tarjetas de presentación', icon: 'fa-id-card', format: 'card' },
  resume:       { label: 'Currículums', icon: 'fa-file-lines', format: 'portrait' },
  invitation:   { label: 'Invitaciones', icon: 'fa-envelope-open-text', format: 'portrait' },
  certificate:  { label: 'Certificados', icon: 'fa-award', format: 'card' },
  marketing:    { label: 'Volantes y marketing', icon: 'fa-bullhorn', format: 'portrait' },
  cover:        { label: 'Portadas para redes', icon: 'fa-image', format: 'cover' }
};

function formatDims(category) {
  const key = (CATEGORY_META[category] && CATEGORY_META[category].format) || 'square';
  return FORMATS[key] || FORMATS.square;
}

const TEMPLATE_TITLES = {
  instagram: ['Oferta de Verano', 'Nuevo Producto', 'Cita Inspiradora', 'Promo Fin de Semana', 'Bienvenida Seguidores'],
  historia: ['Cuenta Regresiva', 'Detrás de Cámaras', 'Pregúntame Algo', 'Lanzamiento Hoy', 'Encuesta Rápida'],
  presentations: ['Pitch de Inversión', 'Reporte Trimestral', 'Plan Estratégico', 'Propuesta de Proyecto', 'Resultados del Equipo'],
  poster: ['Concierto en Vivo', 'Feria de Emprendedores', 'Noche de Cine', 'Torneo Deportivo', 'Exposición de Arte'],
  card: ['Minimalista Negro', 'Elegante Dorado', 'Creativo Color', 'Profesional Azul', 'Moderno Geométrico'],
  resume: ['Currículum Ejecutivo', 'Currículum Creativo', 'Currículum Minimalista', 'Currículum Profesional', 'Currículum Moderno'],
  invitation: ['Cumpleaños Infantil', 'Boda Elegante', 'Baby Shower', 'Graduación', 'Aniversario'],
  certificate: ['Logro Académico', 'Curso Completado', 'Reconocimiento Laboral', 'Participación en Taller', 'Premio Anual'],
  marketing: ['Black Friday', 'Apertura de Local', 'Descuento Especial', 'Volante de Servicio', 'Promoción de Temporada'],
  cover: ['Evento Comunitario', 'Lanzamiento de Marca', 'Webinar en Vivo', 'Feria Virtual']
};

const TEMPLATES = Object.keys(TEMPLATE_TITLES).flatMap(category =>
  TEMPLATE_TITLES[category].map((title, i) => {
    const dims = formatDims(category);
    const seed = `${category}-${i}`;
    return {
      id: `${category}-${i}`, category, title,
      thumb: `https://picsum.photos/seed/${seed}/${Math.round(dims.w / 2)}/${Math.round(dims.h / 2)}`,
      bg: `https://picsum.photos/seed/${seed}/${dims.w}/${dims.h}`
    };
  })
);

const CATEGORIES = [...new Set(TEMPLATES.map(t => t.category))];

function matchesFilter(tpl, query) {
  if (!query) return true;
  const q = query.toLowerCase();
  const label = (CATEGORY_META[tpl.category]? CATEGORY_META[tpl.category].label : '').toLowerCase();
  return tpl.category.toLowerCase().includes(q) || label.includes(q) || tpl.title.toLowerCase().includes(q);
}

function aspectClass(category) {
  const format = (CATEGORY_META[category] && CATEGORY_META[category].format) || 'square';
  if (format === 'story') return 'h-72';
  if (format === 'portrait') return 'h-60';
  if (format === 'wide') return 'h-44';
  if (format === 'card') return 'h-36';
  if (format === 'cover') return 'h-32';
  return 'h-48';
}


const RESIZE_HANDLES = [
  { id: 'nw', x: '0%', y: '0%', cursor: 'nwse-resize' },

function rotateVector(dx, dy, deg) {
  const rad = deg * Math.PI / 180;
  return {
    x: dx * Math.cos(rad) - dy * Math.sin(rad),
    y: dx * Math.sin(rad) + dy * Math.cos(rad)
  };
}

function angleBetween(cx, cy, px, py) {
  return Math.atan2(py - cy, px - cx) * 180 / Math.PI;
}

function computeResize(handle, start, dx, dy) {
  const MIN = 24;
  let x = start.x, y = start.y, width = start.width, height = start.height;
  if (handle.includes('e')) width = Math.max(MIN, start.width + dx);
  if (handle.includes('w')) { width = Math.max(MIN, start.width - dx); x = start.x + start.width - width; }
  if (handle.includes('s')) height = Math.max(MIN, start.height + dy);
  if (handle.includes('n')) { height = Math.max(MIN, start.height - dy); y = start.y + start.height - height; }
  return { x, y, width, height };
}

function ElementFrame({ el, isSelected, onDragStart, onResizeStart, onRotateStart, onEditText }) {
  const style = {
    left: el.x + 'px',
    top: el.y + 'px',
    width: el.width + 'px',
    height: el.height + 'px',
    transform: `rotate(${el.rotation || 0}deg)`,
    transformOrigin: 'center center'
  };

  let content = null;
  if (el.type === 'text') {
    const align = el.textAlign || 'center';
    const justify = align === 'left'? 'flex-start' : align === 'right'? 'flex-end' : 'center';
    content = React.createElement('div', {
      className: "w-full h-full flex items-center px-2 whitespace-pre-wrap break-words",
      style: {
        color: el.color, fontSize: `${el.size}px`, fontWeight: el.fontWeight || '400',
        fontStyle: el.fontStyle || 'normal', fontFamily: el.fontFamily || FONT_OPTIONS[0].value,
        textAlign: align, justifyContent: justify,
        textShadow: '2px 2px 6px rgba(0,0,0,0.8)'
      }
    }, el.content);
  } else if (el.type === 'shape') {
    content = React.createElement('div', {
      className: "w-full h-full",
      style: { backgroundColor: el.color, borderRadius: el.shape === 'circle'? '50%' : '8px' }
    });
  } else if (el.type === 'image') {
    content = React.createElement('img', { src: el.src, draggable: false, className: "w-full h-full object-contain" });
  }

  return React.createElement('div', {
    className: `element ${isSelected? 'selected' : ''}`,
    style,
    onPointerDown: onDragStart,
    onDoubleClick: el.type === 'text'? onEditText : undefined
  },
    content,
    isSelected && RESIZE_HANDLES.map(h => React.createElement('div', {
      key: h.id,
      onPointerDown: (e) => onResizeStart(e, h.id),
      style: {
        position: 'absolute', left: h.x, top: h.y, transform: 'translate(-50%,-50%)',
        width: '8px', height: '8px', background: '#fff', border: '2px solid #ea580c',
        cursor: h.cursor, touchAction: 'none', zIndex: 40
      }
    })),
    isSelected && React.createElement('div', {
      onPointerDown: onRotateStart,
      style: {
        position: 'absolute', left: '50%', top: 'calc(100% + 16px)', transform: 'translate(-50%,-50%)',
        width: '20px', height: '20px', background: '#fff', border: '2px solid #ea580c', borderRadius: '50%',
        display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'grab', touchAction: 'none', zIndex: 40
      }
    }, React.createElement('i', { className: 'fas fa-rotate-right text-[#ea580c] text-xs' }))
  );
}

function typeIcon(type) {
  if (type === 'text') return 'fa-font';
  if (type === 'shape') return 'fa-shapes';
  if (type === 'image') return 'fa-image';
  return 'fa-square';
}

function layerLabel(el) {
  if (el.type === 'text') return el.content || 'Texto';
  if (el.type === 'shape') return el.shape === 'circle'? 'Círculo' : 'Rectángulo';
  if (el.type === 'image') return 'Imagen';
  return 'Elemento';
}

function App() {
  const [active, setActive] = useState('home');
  const [pages, setPages] = useState([]);
  const [currentPageIndex, setCurrentPageIndex] = useState(0);
  const [selectedElementId, setSelectedElementId] = useState(null);
  const [layersOpen, setLayersOpen] = useState(false);
  const [downloadOpen, setDownloadOpen] = useState(false);
  const [homeQuery, setHomeQuery] = useState('');
  const [libraryFilter, setLibraryFilter] = useState('');
  const [slides, setSlides] = useState([]);
  const [currentSlide, setCurrentSlide] = useState(0);

  const fileInputRef = useRef(null);
  const canvasRef = useRef(null);
  const dragRef = useRef({ isDragging: false, elementId: null, startX: 0, startY: 0, startLeft: 0, startTop: 0 });
  const resizeRef = useRef({ isResizing: false, elementId: null, handle: null, startX: 0, startY: 0, startEl: null });
  const rotateRef = useRef({ isRotating: false, elementId: null, centerX: 0, centerY: 0, startAngle: 0, startRotation: 0 });

  // Autoguardado
  useEffect(() => {
    const saved = localStorage.getItem('voltara_pages');
    if (saved) setPages(JSON.parse(saved));
  }, []);

  useEffect(() => {
    if (pages.length > 0) localStorage.setItem('voltara_pages', JSON.stringify(pages));
  }, [pages]);

  const currentPage = pages[currentPageIndex] || null;
  const elements = currentPage? currentPage.elements : [];
  const selectedEl = elements.find(el => el.id === selectedElementId) || null;
  const visibleTemplates = TEMPLATES.filter(t => matchesFilter(t, libraryFilter));

  const setElements = (updater) => {
    setPages(prev => prev.map((p, i) => {
      if (i!== currentPageIndex) return p;
      const nextElements = typeof updater === 'function'? updater(p.elements) : updater;
      return {...p, elements: nextElements };
    }));
  };

  const changeTab = (key) => {
    setActive(key);
    setLayersOpen(false);
    setDownloadOpen(false);
  };

  const runSearch = (query) => {
    setLibraryFilter(query);
    changeTab('library');
  };

  const openTemplate = (tpl) => {
    const dims = formatDims(tpl.category);
    const elWidth = Math.round(dims.w * 0.7);
    const elHeight = Math.round(dims.h * 0.18);
    setPages([{
      id: Date.now(),
      background: tpl.bg,
      canvasWidth: dims.w,
      canvasHeight: dims.h,
      elements: [{
        id: Date.now() + 1,
        type: 'text',
        content: tpl.title,
        x: Math.round((dims.w - elWidth) / 2), y: Math.round(dims.h * 0.4),
        width: elWidth, height: elHeight, rotation: 0,
        size: Math.max(20, Math.round(dims.w * 0.07)), color: '#ffffff', fontWeight: '700',
        fontStyle: 'normal', fontFamily: FONT_OPTIONS[0].value, textAlign: 'center', visible: true
      }]
    }]);
    setCurrentPageIndex(0);
    setSelectedElementId(null);
    setActive('editor');
  };

  const addPage = () => {
    const bg = currentPage? currentPage.background : null;
    const w = currentPage? currentPage.canvasWidth : FORMATS.wide.w;
    const h = currentPage? currentPage.canvasHeight : FORMATS.wide.h;
    setPages(prev => [...prev, { id: Date.now(), background: bg, canvasWidth: w, canvasHeight: h, elements: [] }]);
    setCurrentPageIndex(pages.length);
    setSelectedElementId(null);
  };

  const deletePage = (idx) => {
    if (pages.length <= 1) return;
    const newPages = pages.filter((_, i) => i!== idx);
    setPages(newPages);
    setCurrentPageIndex(Math.min(currentPageIndex, newPages.length - 1));
    setSelectedElementId(null);
  };

  const goToPage = (idx) => {
    setCurrentPageIndex(idx);
    setSelectedElementId(null);
  };

  const addText = () => {
    const newEl = {
      id: Date.now(), type: 'text', content: 'Nuevo texto', x: 160, y: 220, width: 220, height: 60, rotation: 0,
      size: 36, color: '#ffffff', fontWeight: '400', fontStyle: 'normal', fontFamily: FONT_OPTIONS[0].value,
      textAlign: 'center', visible: true
    };
    setElements(prev => [...prev, newEl]);
    setSelectedElementId(newEl.id);
  };

  const addShape = (shape) => {
    const newEl = { id: Date.now(), type: 'shape', shape, x: 200, y: 200, width: 180, height: 120, rotation: 0, color: '#ea580c', visible: true };
    setElements(prev => [...prev, newEl]);
    setSelectedElementId(newEl.id);
  };

  const addImage = (e) => {
    const file = e.target.files[0];
    if (!file) { return; }
    const reader = new FileReader();
    reader.onload = (ev) => {
      const newEl = { id: Date.now(), type: 'image', src: ev.target.result, x: 150, y: 150, width: 300, height: 220, rotation: 0, visible: true };
      setElements(prev => [...prev, newEl]);
      setSelectedElementId(newEl.id);
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  };

  const deleteElement = () => {
    if (!selectedElementId) return;
    setElements(prev => prev.filter(el => el.id!== selectedElementId));
    setSelectedElementId(null);
  };

  const moveLayer = (id, direction) => {
    setElements(prev => {
      const idx = prev.findIndex(el => el.id === id);
      if (idx === -1) return prev;
      const newIdx = direction === 'up'? idx + 1 : idx - 1;
      if (newIdx < 0 || newIdx >= prev.length) return prev;
      const next = [...prev];
      [next[idx], next[newIdx]] = [next[newIdx], next[idx]];
      return next;
    });
  };

  const toggleVisible = (id) => {
    setElements(prev => prev.map(el => el.id === id? {...el, visible: el.visible === false? true : false } : el));
  };

  const updateElement = (id, updates) => {
    setElements(prev => prev.map(el => el.id === id? {...el,...updates} : el));
  };

  const handlePointerDown = (e, id) => {
    e.stopPropagation();
    const el = elements.find(elem => elem.id === id);
    if (!el) return;
    setSelectedElementId(id);
    const clientX = e.clientX?? (e.touches && e.touches[0].clientX);
    const clientY = e.clientY?? (e.touches && e.touches[0].clientY);
    dragRef.current = { isDragging: true, elementId: id, startX: clientX, startY: clientY, startLeft: el.x, startTop: el.y };
  };

  const handleResizeStart = (e, handleId, el) => {
    e.stopPropagation();
    setSelectedElementId(el.id);
    const clientX = e.clientX?? (e.touches && e.touches[0].clientX);
    const clientY = e.clientY?? (e.touches && e.touches[0].clientY);
    resizeRef.current = {
      isResizing: true, elementId: el.id, handle: handleId,
      startX: clientX, startY: clientY,
      startEl: { x: el.x, y: el.y, width: el.width, height: el.height, rotation: el.rotation || 0, size: el.size }
    };
  };

  const handleRotateStart = (e, el) => {
    e.stopPropagation();
    setSelectedElementId(el.id);
    const rect = canvasRef.current.getBoundingClientRect();
    const centerX = rect.left + el.x + el.width / 2;
    const centerY = rect.top + el.y + el.height / 2;
    const clientX = e.clientX?? (e.touches && e.touches[0].clientX);
    const clientY = e.clientY?? (e.touches && e.touches[0].clientY);
    rotateRef.current = {
      isRotating: true, elementId: el.id, centerX, centerY,
      startAngle: angleBetween(centerX, centerY, clientX, clientY),
      startRotation: el.rotation || 0
    };
  };

  const handlePointerMove = (e) => {
    const clientX = e.clientX?? (e.touches && e.touches[0].clientX);
    const clientY = e.clientY?? (e.touches && e.touches[0].clientY);

    if (dragRef.current.isDragging) {
      if (e.cancelable) e.preventDefault();
      const { startX, startY, startLeft, startTop, elementId } = dragRef.current;
      const dx = clientX - startX;
      const dy = clientY - startY;
      updateElement(elementId, { x: Math.max(0, startLeft + dx), y: Math.max(0, startTop + dy) });
      return;
    }

    if (resizeRef.current.isResizing) {
      if (e.cancelable) e.preventDefault();
      const { startX, startY, startEl, elementId, handle } = resizeRef.current;
      const dx = clientX - startX;
      const dy = clientY - startY;
      const local = rotateVector(dx, dy, -startEl.rotation);
      const next = computeResize(handle, startEl, local.x, local.y);
      const updates = {...next };
      if (startEl.size) {
        const scale = (next.width / startEl.width + next.height / startEl.height) / 2;
        updates.size = Math.max(8, Math.round(startEl.size * scale));
      }
      updateElement(elementId, updates);
      return;
    }

    if (rotateRef.current.isRotating) {
      if (e.cancelable) e.preventDefault();
      const { centerX, centerY, startAngle, startRotation, elementId } = rotateRef.current;
      const currentAngle = angleBetween(centerX, centerY, clientX, clientY);
      updateElement(elementId, { rotation: startRotation + (currentAngle - startAngle) });
    }
  };

  const handlePointerUp = () => {
    dragRef.current.isDragging = false;
    resizeRef.current.isResizing = false;
    rotateRef.current.isRotating = false;
  };

  useEffect(() => {
    document.addEventListener('mousemove', handlePointerMove);
    document.addEventListener('mouseup', handlePointerUp);
    document.addEventListener('touchmove', handlePointerMove, { passive: false });
    document.addEventListener('touchend', handlePointerUp);
    return () => {
      document.removeEventListener('mousemove', handlePointerMove);
      document.removeEventListener('mouseup', handlePointerUp);

      const ratio = Math.min((pageW - margin * 2) / canvas.width, (pageH - margin * 2) / canvas.height);
