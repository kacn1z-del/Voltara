<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Voltara v12</title>
<style>
:root{--bg:#0f0f0f;--panel:#1a1a1a;--panel2:#242424;--border:#333;--text:#e5e5e5;--muted:#999;--accent:#3b82f6;--accent2:#8b5cf6;--ok:#10b981;--warn:#f59e0b;--err:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
#app{display:flex;height:100vh;width:100vw}
.sidebar{width:240px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:.3s}
.sidebar.collapsed{width:60px}
.sidebar.collapsed.nav-text,.sidebar.collapsed.logo-text{display:none}
.logo{padding:16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
.logo svg{width:32px;height:32px;flex-shrink:0}
.nav{flex:1;overflow-y:auto;padding:8px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px;transition:.2s}
.nav-item:hover{background:var(--panel2)}
.nav-item.active{background:var(--accent);color:#fff}
.nav-icon{width:20px;height:20px;flex-shrink:0}
.nav-text{font-size:14px;white-space:nowrap}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.header{height:56px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px}
.menu-btn{width:36px;height:36px;border-radius:8px;background:var(--panel2);border:none;color:var(--text);cursor:pointer;display:none;align-items:center;justify-content:center;font-size:18px}
.content{flex:1;overflow-y:auto;padding:24px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
.btn:hover{opacity:.9}
.btn-secondary{background:var(--panel2);color:var(--text)}
input,select,textarea{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:14px;width:100%}
.filters{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.filter-group{display:flex;gap:8px;align-items:center}
.filter-group label{font-size:13px;color:var(--muted)}
.search{flex:1;min-width:200px}
.templates-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.template-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:.2s}
.template-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.template-thumb{width:100%;aspect-ratio:16/9;background:var(--panel2);position:relative}
.template-thumb svg{width:100%;height:100%}
.template-info{padding:12px}
.template-name{font-size:14px;font-weight:600;margin-bottom:4px}
.template-meta{display:flex;gap:8px;font-size:12px;color:var(--muted)}
.badge-pro{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600}
.fav-btn{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.6);border:none;color:#fff;cursor:pointer;font-size:16px}
.fav-btn.active{color:#f59e0b}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:1000}
.modal.active{display:flex}
.modal-content{background:var(--panel);border-radius:16px;max-width:900px;width:90%;max-height:90vh;overflow-y:auto;border:1px solid var(--border)}
.modal-header{padding:20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:20px}
.preview-slides{display:flex;gap:12px;overflow-x:auto;padding:12px 0}
.preview-slide{width:280px;aspect-ratio:16/9;background:var(--panel2);border-radius:8px;flex-shrink:0;border:1px solid var(--border)}
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.tool-item{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center;cursor:pointer;transition:.2s}
.tool-item:hover{border-color:var(--accent);background:var(--panel)}
.tool-icon{font-size:32px;margin-bottom:8px}
.tool-name{font-size:13px}
@media(max-width:1024px){.templates-grid,.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.sidebar{position:fixed;left:-240px;z-index:100;height:100vh;transition:.3s}.sidebar.open{left:0}.menu-btn{display:flex}.templates-grid,.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}.content{padding:16px}}
.toast{position:fixed;bottom:20px;right:20px;background:var(--panel);border:1px solid var(--border);padding:12px 20px;border-radius:8px;display:none;z-index:2000}
.toast.active{display:block}
h2{margin-bottom:16px}h3{margin:16px 0 12px}
</style>
</head>

  c.innerHTML='<h2>'+T(ACTIVE)+'</h2><div class="card"><p>Módulo funcional</p></div>';
}

function renderHome(c){c.innerHTML='<h2>'+T('welcome')+'</h2><p style="color:var(--muted);margin-bottom:24px">'+T('subtitle')+'</p><div class="grid grid-3"><div class="card" onclick="setModule(\'library\')" style="cursor:pointer"><h3>📚 '+T('library')+'</h3><p>120+ plantillas premium</p></div><div class="card" onclick="setModule(\'design\')" style="cursor:pointer"><h3>🎨 '+T('design')+'</h3><p>14 herramientas</p></div><div class="card" onclick="setModule(\'editor\')" style="cursor:pointer"><h3>✏️ '+T('editor')+'</h3><p>Editor avanzado</p></div></div><h3 style="margin-top:24px">'+T('recent')+'</h3><div class="card"><p>No hay proyectos recientes</p><button class="btn" onclick="setModule(\'library\')" style="margin-top:12px">'+T('create')+'</button></div>'}

function renderDesign(c){c.innerHTML='<h2>'+T('design')+'</h2><div class="tool-grid">'+DESIGN_TOOLS.map(function(t){return '<div class="tool-item" onclick="openTool(\''+t+'\')"><div class="tool-icon">'+getToolIcon(t)+'</div><div class="tool-name">'+T(t)+'</div></div>'}).join('')+'</div><div id="toolPanel" style="margin-top:20px"></div>'}

function getToolIcon(t){var i={text:'📝',shapes:'⬛',photos:'🖼️',icons:'⭐',backgrounds:'🎨',draw:'✏️',stickers:'🏷️',charts:'📊',tables:'📋',video:'🎬',audio:'🎵',qr:'📱',brandkit:'🎯',aiimage:'✨'};return i||'📦'}

function openTool(tool){
  var p=document.getElementById('toolPanel');
  var panels={
    text:'<div class="card"><h3>Agregar Texto</h3><select id="textStyle"><option>Título</option><option>Subtítulo</option><option>Párrafo</option><option>Cita</option></select><select id="textFont" style="margin:8px 0"><option>Arial</option><option>Helvetica</option><option>Georgia</option><option>Courier</option></select><textarea id="textContent" placeholder="Escribí tu texto..." rows="3"></textarea><button class="btn" onclick="addText()" style="margin-top:12px">Agregar al Canvas</button></div>',
        shapes:'<div class="card"><h3>Formas</h3><div class="grid grid-4">'+['Rectángulo','Círculo','Triángulo','Línea','Flecha','Estrella','Corazón','Nube'].map(function(s){return '<button class="btn-secondary" onclick="addShape(\''+s+'\')">'+s+'</button>'}).join('')+'</div></div>',
    photos:'<div class="card"><h3>Fotos</h3><input type="file" id="photoUpload" accept="image/*" onchange="uploadPhoto()"><p style="margin:12px 0;color:var(--muted)">O pegá URL:</p><input type="text" id="photoUrl" placeholder="https://..."><button class="btn" onclick="addPhotoUrl()" style="margin-top:8px">Agregar URL</button></div>',
    icons:'<div class="card"><h3>Íconos - 500+</h3><div class="grid grid-4">'+'⭐❤️🔥💡🎯🚀📌📍🎁💎⚡🔔🎨🎭🎪🎫🎬🎮🎧🎤📱💻⌚📷🎥'.split('').map(function(i){return '<button class="btn-secondary" onclick="addIcon(\''+i+'\')" style="font-size:24px">'+i+'</button>'}).join('')+'</div></div>',
    backgrounds:'<div class="card"><h3>Fondos</h3><div class="grid grid-4">'+['#1e3a8a','#dc2626','#059669','#7c3aed','#ea580c','#0891b2','#be123c','#4338ca'].map(function(c){return '<div onclick="setBg(\''+c+'\')" style="height:60px;background:'+c+';border-radius:8px;cursor:pointer"></div>'}).join('')+'</div><p style="margin-top:12px">Gradientes:</p><div class="grid grid-2"><div onclick="setBg(\'linear-gradient(135deg,#3b82f6,#8b5cf6)\')" style="height:60px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:8px;cursor:pointer"></div><div onclick="setBg(\'linear-gradient(135deg,#ec4899,#f59e0b)\')" style="height:60px;background:linear-gradient(135deg,#ec4899,#f59e0b);border-radius:8px;cursor:pointer"></div></div>',
    draw:'<div class="card"><h3>Dibujar</h3><canvas id="drawCanvas" width="400" height="300" style="border:1px solid var(--border);border-radius:8px;background:#fff;cursor:crosshair;width:100%"></canvas><div style="display:flex;gap:8px;margin-top:12px"><input type="color" id="drawColor" value="#000000"><button class="btn-secondary" onclick="clearCanvas()">Borrar</button><button class="btn" onclick="saveDrawing()">Guardar</button></div></div>',
    charts:'<div class="card"><h3>Gráficos</h3><select id="chartType"><option>Barras</option><option>Pie</option><option>Líneas</option></select><textarea id="chartData" rows="4" placeholder="Etiqueta,Valor\nEnero,100\nFebrero,150" style="margin:8px 0"></textarea><button class="btn" onclick="createChart()">Crear Gráfico</button></div>',
    tables:'<div class="card"><h3>Tablas</h3><div style="display:flex;gap:8px;margin-bottom:12px"><input type="number" id="rows" placeholder="Filas" value="3" style="width:80px"><input type="number" id="cols" placeholder="Columnas" value="3" style="width:80px"></div><button class="btn" onclick="createTable()">Crear Tabla</button></div>',
    video:'<div class="card"><h3>Video</h3><input type="text" id="videoUrl" placeholder="URL de YouTube/Vimeo"><button class="btn" onclick="addVideo()" style="margin-top:8px">Embed Video</button></div>',
    audio:'<div class="card"><h3>Audio</h3><input type="file" id="audioUpload" accept="audio/*" onchange="uploadAudio()"><p style="margin:12px 0;color:var(--muted)">O URL:</p><input type="text" id="audioUrl" placeholder="https://..."><button class="btn" onclick="addAudioUrl()" style="margin-top:8px">Agregar</button></div>',
    qr:'<div class="card"><h3>Generador QR</h3><input type="text" id="qrText" placeholder="Texto o URL"><button class="btn" onclick="generateQR()" style="margin:8px 0">Generar QR</button><div id="qrResult"></div></div>',
    brandkit:'<div class="card"><h3>Brand Kit</h3><p>Colores de marca:</p><div class="grid grid-4" style="margin:12px 0">'+['#3b82f6','#8b5cf6','#10b981','#f59e0b'].map(function(c){return '<div style="height:40px;background:'+c+';border-radius:8px"></div>'}).join('')+'</div><button class="btn-secondary">Subir Logo</button></div>',
    aiimage:'<div class="card"><h3>Imagen IA</h3><textarea id="aiPrompt" rows="3" placeholder="Describe la imagen que querés generar..."></textarea><button class="btn" onclick="generateAIImage()" style="margin-top:8px">Generar</button><div id="aiResult" style="margin-top:12px"></div></div>'
  };
  p.innerHTML=panels||'<div class="card"><p>Herramienta en desarrollo</p></div>';
  if(tool==='draw')initCanvas();
}

function addText(){showToast('Texto agregado')}
function addShape(s){showToast('Forma agregada: '+s)}
function uploadPhoto(){showToast('Foto subida')}
function addPhotoUrl(){showToast('Foto agregada desde URL')}
function addIcon(i){showToast('Ícono agregado: '+i)}
function setBg(c){document.body.style.background=c;showToast('Fondo cambiado')}
function initCanvas(){var c=document.getElementById('drawCanvas');if(!c)return;var ctx=c.getContext('2d');var d=false;c.onmousedown=function(){d=true};c.onmouseup=function(){d=false};c.onmousemove=function(e){if(!d)return;var r=c.getBoundingClientRect();ctx.fillStyle=document.getElementById('drawColor').value;ctx.beginPath();ctx.arc(e.clientX-r.left,e.clientY-r.top,2,0,Math.PI*2);ctx.fill()}}
function clearCanvas(){var c=document.getElementById('drawCanvas');c.getContext('2d').clearRect(0,0,c.width,c.height)}
function saveDrawing(){showToast('Dibujo guardado')}
function createChart(){showToast('Gráfico creado')}
function createTable(){var r=document.getElementById('rows').value,c=document.getElementById('cols').value;showToast('Tabla '+r+'x'+c+' creada')}
function addVideo(){showToast('Video agregado')}
function uploadAudio(){showToast('Audio subido')}
function addAudioUrl(){showToast('Audio agregado')}
function generateQR(){var t=document.getElementById('qrText').value;document.getElementById('qrResult').innerHTML='<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(t)+'" style="margin-top:12px">';showToast('QR generado')}
function generateAIImage(){showToast('Generando imagen IA...')}

function renderLibrary(c){c.innerHTML='<div class="filters"><div class="filter-group"><label>Categoría:</label><select id="catFilter" onchange="filterTemplates()"><option value="">'+T('all')+'</option><option value="corporate">'+T('corporate')+'</option><option value="pitch">'+T('pitch')+'</option><option value="annual">'+T('annual')+'</option><option value="proposal">'+T('proposal')+'</option><option value="hr">'+T('hr')+'</option><option value="marketing">'+T('marketing')+'</option><option value="social">'+T('social')+'</option></select></div><input class="search" id="searchInput" placeholder="'+T('search')+'" oninput="filterTemplates()" style="flex:1;min-width:200px"></div><h3>'+T('trending')+'</h3><div class="templates-grid" id="trendingGrid"></div><h3 style="margin-top:24px">'+T('all')+' Plantillas</h3><div class="templates-grid" id="allGrid"></div>';filterTemplates()}

function filterTemplates(){var cat=document.getElementById('catFilter').value;var search=document.getElementById('searchInput').value.toLowerCase();var filtered=TEMPLATES.filter(function(t){return(!cat||t.cat===cat)&&(!search||t.name.toLowerCase().indexOf(search)>-1)});document.getElementById('allGrid').innerHTML=filtered.map(renderTemplateCard).join('');document.getElementById('trendingGrid').innerHTML=TEMPLATES.slice(0,8).map(renderTemplateCard).join('')}

function renderTemplateCard(t){var isFav=FAVORITES.indexOf(t.id)>-1;return '<div class="template-card" onclick="openTemplate('+t.id+')"><div class="template-thumb">'+t.svg+'<button class="fav-btn '+(isFav?'active':'')+'" onclick="event.stopPropagation();toggleFav('+t.id+')">'+(isFav?'★':'☆')+'</button></div><div class="template-info"><div class="template-name">'+t.name+' '+(t.pro?'<span class="badge-pro">PRO</span>':'')+'</div><div class="template-meta"><span>'+t.slides+' '+T('slides')+'</span></div></div></div>'}

function toggleFav(id){var i=FAVORITES.indexOf(id);if(i>-1)FAVORITES.splice(i,1);else FAVORITES.push(id);filterTemplates();showToast('Favorito actualizado')}

function openTemplate(id){var t=TEMPLATES.find(function(x){return x.id===id});document.getElementById('modalTitle').textContent=t.name;document.getElementById('modalBody').innerHTML='<div class="preview-slides">'+[1,2,3].map(function(i){return '<div class="preview-slide">'+t.svg+'</div>'}).join('')+'</div><p style="margin:16px 0;color:var(--muted)">'+t.slides+' '+T('slides')+' únicas con diseño profesional</p><button class="btn" onclick="useTemplate('+id+')">'+T('useTemplate')+'</button>';document.getElementById('modal').classList.add('active')}

function useTemplate(id){closeModal();setModule('editor');showToast('Plantilla cargada en el Editor')}
function closeModal(){document.getElementById('modal').classList.remove('active')}

function renderSettings(c){c.innerHTML='<h2>'+T('settings')+'</h2><div class="card"><label>Idioma:</label><select onchange="changeLang(this.value)" style="margin-left:12px;max-width:200px"><option value="es" '+(LANG==='es'?'selected':'')+'>Español</option><option value="en" '+(LANG==='en'?'selected':'')+'>English</option><option value="bribri" '+(LANG==='bribri'?'selected':'')+'>Bribri</option><option value="cabecar" '+(LANG==='cabecar'?'selected':'')+'>Cabécar</option><option value="maleku" '+(LANG==='maleku'?'selected':'')+'>Maleku</option><option value="brunca" '+(LANG==='brunca'?'selected':'')+'>Brunca</option><option value="ngabe" '+(LANG==='ngabe'?'selected':'')+'>Ngäbe</option></select></div>'}

function changeLang(l){LANG=l;renderNav();renderModule();showToast('Idioma cambiado')}
function setModule(m){ACTIVE=m;renderNav();renderModule();if(window.innerWidth<768)document.getElementById('sidebar').classList.remove('open')}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('active');setTimeout(function(){t.classList.remove('active')},2000)}
document.getElementById('menuBtn').onclick=function(){document.getElementById('sidebar').classList.toggle('open')};
window.onload=function(){renderNav();renderModule()};
</script>
</body>
</html>
