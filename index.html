<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voltara v12</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');
* { font-family: 'Inter', sans-serif; }
.font-display { font-family: 'Space Grotesk', sans-serif; }
.canvas-container { background-size: cover; background-position: center; }
</style>
</head>
<body class="bg-zinc-950 text-white">
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

// ==================== 45 PLANTILLAS ====================
const TEMPLATES = [
  { id: 1, category: "nature", title: "Bosque Místico", thumb: "https://picsum.photos/id/1016/600/380", bg: "https://picsum.photos/id/1016/1200/800" },
  { id: 2, category: "nature", title: "Montañas al Atardecer", thumb: "https://picsum.photos/id/1018/600/380", bg: "https://picsum.photos/id/1018/1200/800" },
  { id: 3, category: "infographic", title: "Infografía Datos", thumb: "https://picsum.photos/id/1015/600/380", bg: "https://picsum.photos/id/1015/1200/800" },
  { id: 4, category: "presentations", title: "Pitch Deck Moderno", thumb: "https://picsum.photos/id/201/600/380", bg: "https://picsum.photos/id/201/1200/800" },
  { id: 5, category: "social", title: "Post Instagram", thumb: "https://picsum.photos/id/237/600/380", bg: "https://picsum.photos/id/237/1200/800" },
  { id: 6, category: "social", title: "Historia Facebook", thumb: "https://picsum.photos/id/669/600/380", bg: "https://picsum.photos/id/669/1200/800" },
  { id: 7, category: "marketing", title: "Flyer Promocional", thumb: "https://picsum.photos/id/870/600/380", bg: "https://picsum.photos/id/870/1200/800" },
  { id: 8, category: "marketing", title: "Banner Publicitario", thumb: "https://picsum.photos/id/133/600/380", bg: "https://picsum.photos/id/133/1200/800" },
  // ... (continúo hasta 45)
  { id: 9, category: "infographic", title: "Timeline Proceso", thumb: "https://picsum.photos/id/312/600/380", bg: "https://picsum.photos/id/312/1200/800" },
  { id: 10, category: "business", title: "Reporte Anual", thumb: "https://picsum.photos/id/366/600/380", bg: "https://picsum.photos/id/366/1200/800" },
  { id: 11, category: "social", title: "Portada YouTube", thumb: "https://picsum.photos/id/431/600/380", bg: "https://picsum.photos/id/431/1200/800" },
  { id: 12, category: "nature", title: "Playa Tropical", thumb: "https://picsum.photos/id/101/600/380", bg: "https://picsum.photos/id/101/1200/800" },
  { id: 13, category: "infographic", title: "Comparativa", thumb: "https://picsum.photos/id/201/600/380", bg: "https://picsum.photos/id/201/1200/800" },
  { id: 14, category: "marketing", title: "Cupón Descuento", thumb: "https://picsum.photos/id/251/600/380", bg: "https://picsum.photos/id/251/1200/800" },
  { id: 15, category: "business", title: "Plan Estratégico", thumb: "https://picsum.photos/id/870/600/380", bg: "https://picsum.photos/id/870/1200/800" },
  // Agrego más para llegar a ~45 (puedes seguir agregando)
  ...Array.from({length: 30}, (_, i) => ({
    id: 16 + i,
    category: ["nature","social","marketing","infographic","business"][i%5],
    title: ["Paisaje", "Redes", "Marketing", "Datos", "Negocios"][i%5] + " " + (i+1),
    thumb: `https://picsum.photos/id/${100 + i}/600/380`,
    bg: `https://picsum.photos/id/${100 + i}/1200/800`
  }))
];

function App() {
  const [active, setActive] = useState('home');
  const [selectedTemplate, setSelectedTemplate] = useState(null);
  const [elements, setElements] = useState([]);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [selectedElementId, setSelectedElementId] = useState(null);

  const openTemplate = (tpl) => {
    setSelectedTemplate(tpl);
    setActive('editor');
    setElements([{
      id: Date.now(),
      type: 'text',
      content: tpl.title,
      x: 120,
      y: 180,
      size: 42,
      color: '#ffffff'
    }]);
  };

  const addText = () => {
    const newEl = { id: Date.now(), type: 'text', content: 'Nuevo texto', x: 150, y: 250, size: 28, color: '#ffffff' };
    setElements([...elements, newEl]);
    setSelectedElementId(newEl.id);
  };

  const addShape = () => {
    const newEl = { id: Date.now(), type: 'shape', shape: 'rect', x: 200, y: 200, width: 150, height: 100, color: '#6366f1' };
    setElements([...elements, newEl]);
  };

  const addImage = () => {
    const url = prompt("Pega la URL de una imagen:");
    if (url) {
      const newEl = { id: Date.now(), type: 'image', src: url, x: 150, y: 150, width: 250, height: 180 };
      setElements([...elements, newEl]);
    }
  };

  const updateElement = (id, updates) => {
    setElements(elements.map(el => el.id === id ? {...el, ...updates} : el));
  };

  return (
    <div className="flex h-screen bg-zinc-950 overflow-hidden">
      {/* Sidebar */}
      <div className={`${sidebarOpen ? 'translate-x-0' : '-translate-x-full'} lg:translate-x-0 fixed lg:static z-50 w-72 h-full bg-zinc-900 border-r border-zinc-800 transition-transform flex flex-col`}>
        <div className="p-5 flex items-center gap-3 border-b border-zinc-800">
          <div className="w-10 h-10 bg-gradient-to-br from-violet-600 to-fuchsia-500 rounded-2xl flex items-center justify-center">
            <i className="fas fa-bolt text-white text-2xl"></i>
          </div>
          <div className="font-display text-3xl font-semibold">Voltara <span className="text-sm bg-violet-600 px-2 py-0.5 rounded-full">v12</span></div>
        </div>

        <div className="flex-1 overflow-y-auto p-3">
          {[
            {id:'home', icon:'fa-home', label:'Inicio'},
            {id:'library', icon:'fa-layer-group', label:'Biblioteca'},
            {id:'editor', icon:'fa-pen-ruler', label:'Editor'},
            {id:'creative', icon:'fa-wand-magic-sparkles', label:'IA Creativa'},
          ].map(item => (
            <button key={item.id} onClick={() => {setActive(item.id); setSidebarOpen(false);}}
              className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl mb-1 ${active === item.id ? 'bg-violet-600 text-white' : 'hover:bg-zinc-800 text-zinc-300'}`}>
              <i className={`fas ${item.icon}`}></i>
              <span>{item.label}</span>
            </button>
          ))}
        </div>
      </div>

      {/* Main */}
      <div className="flex-1 flex flex-col">
        <div className="h-14 border-b border-zinc-800 bg-zinc-900 px-4 flex items-center justify-between">
          <button onClick={() => setSidebarOpen(!sidebarOpen)} className="lg:hidden text-2xl"><i className="fas fa-bars"></i></button>
        </div>

        <div className="flex-1 overflow-auto">
          {active === 'library' && (
            <div className="p-6">
              <h2 className="text-3xl font-semibold mb-8">Plantillas ({TEMPLATES.length})</h2>
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                {TEMPLATES.map(tpl => (
                  <div key={tpl.id} onClick={() => openTemplate(tpl)} className="cursor-pointer bg-zinc-900 rounded-3xl overflow-hidden border border-zinc-800 hover:border-violet-500 transition">
                    <img src={tpl.thumb} className="w-full h-44 object-cover" />
                    <div className="p-3">
                      <p className="font-medium text-sm line-clamp-2">{tpl.title}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {active === 'editor' && selectedTemplate && (
            <div className="relative h-full">
              <div className="canvas-container absolute inset-0" style={{backgroundImage: `url(${selectedTemplate.bg})`}}>
                {elements.map(el => (
                  <div
                    key={el.id}
                    className={`absolute p-3 rounded border-2 cursor-move ${selectedElementId === el.id ? 'border-violet-400' : 'border-transparent hover:border-white/50'}`}
                    style={{
                      left: el.x, top: el.y,
                      color: el.color,
                      fontSize: el.size + 'px',
                      textShadow: '2px 2px 4px rgba(0,0,0,0.8)'
                    }}
                    onClick={() => setSelectedElementId(el.id)}
                    onDoubleClick={() => {
                      const newText = prompt("Editar texto:", el.content);
                      if (newText !== null) updateElement(el.id, {content: newText});
                    }}
                  >
                    {el.content}
                  </div>
                ))}
              </div>

              {/* Toolbar Mejorado */}
              <div className="absolute top-6 left-1/2 -translate-x-1/2 bg-zinc-900/95 backdrop-blur border border-zinc-700 rounded-3xl px-6 py-3 flex gap-3 z-20 shadow-2xl">
                <button onClick={addText} className="flex items-center gap-2 px-5 py-2 hover:bg-zinc-800 rounded-2xl">
                  <i className="fas fa-font"></i> Texto
                </button>
                <button onClick={addShape} className="flex items-center gap-2 px-5 py-2 hover:bg-zinc-800 rounded-2xl">
                  <i className="fas fa-shapes"></i> Forma
                </button>
                <button onClick={addImage} className="flex items-center gap-2 px-5 py-2 hover:bg-zinc-800 rounded-2xl">
                  <i className="fas fa-image"></i> Imagen
                </button>
              </div>
            </div>
          )}

          {active === 'home' && (
            <div className="p-8 text-center">
              <h1 className="text-4xl font-semibold mb-4">Bienvenido a Voltara v12</h1>
              <p className="text-zinc-400">Elige una plantilla en Biblioteca</p>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
