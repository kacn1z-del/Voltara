function bgTypeFor(category, i) {
  const v = CATEGORY_BG[category] || 'photo';
  return Array.isArray(v)? v[i % v.length] : v;
}

function formatDims(category) {
  const key = (CATEGORY_META[category] && CATEGORY_META[category].format) || 'square';
  return FORMATS[key] || FORMATS.square;
}

const TPL_FONT = "'DM Sans', sans-serif";

function buildCenteredLayout(dims, title, subtitle, accentColor, textColor, titleFont, textShadow, shapeShadow) {
  const titleSize = Math.max(20, Math.round(dims.w * 0.065));
  const titleWidth = Math.round(dims.w * 0.74);
  const titleHeight = Math.max(Math.round(dims.h * 0.16), Math.round(titleSize * 2.4));
  const titleX = Math.round((dims.w - titleWidth) / 2);
  const titleY = Math.round(dims.h * 0.32);

  const ruleWidth = Math.round(dims.w * 0.12);
  const ruleHeight = Math.max(3, Math.round(dims.h * 0.006));
  const ruleX = Math.round((dims.w - ruleWidth) / 2);
  const ruleY = titleY + titleHeight + Math.round(dims.h * 0.02);

  const subSize = Math.max(13, Math.round(dims.w * 0.028));
  const subWidth = Math.round(dims.w * 0.66);
  const subHeight = Math.max(Math.round(dims.h * 0.08), Math.round(subSize * 2.4));
  const subX = Math.round((dims.w - subWidth) / 2);
  const subY = ruleY + ruleHeight + Math.round(dims.h * 0.025);

  return [
    { id: Date.now() + 1, type: 'text', content: title, x: titleX, y: titleY, width: titleWidth, height: titleHeight, rotation: 0, size: titleSize, color: textColor, fontWeight: '700', fontStyle: 'normal', fontFamily: titleFont, textAlign: 'center', textShadow: textShadow, visible: true },
    { id: Date.now() + 2, type: 'shape', shape: 'rect', x: ruleX, y: ruleY, width: ruleWidth, height: ruleHeight, rotation: 0, color: accentColor, boxShadow: shapeShadow, visible: true },
    subtitle? { id: Date.now() + 3, type: 'text', content: subtitle, x: subX, y: subY, width: subWidth, height: subHeight, rotation: 0, size: subSize, color: textColor, fontWeight: '400', fontStyle: 'normal', fontFamily: TPL_FONT, textAlign: 'center', textShadow: textShadow, visible: true } : null
  ].filter(Boolean);
}

function buildBadgeLayout(dims, title, subtitle, badgeText, accentColor, textColor, titleFont, textShadow, shapeShadow) {
  const badgeHeight = Math.max(22, Math.round(dims.h * 0.055));
  const badgeWidth = Math.round(dims.w * 0.42);
  const badgeX = Math.round((dims.w - badgeWidth) / 2);
  const badgeY = Math.round(dims.h * 0.24);
  const badgeFontSize = Math.max(11, Math.round(badgeHeight * 0.42));

  const titleSize = Math.max(20, Math.round(dims.w * 0.065));
  const titleWidth = Math.round(dims.w * 0.74);
  const titleHeight = Math.max(Math.round(dims.h * 0.16), Math.round(titleSize * 2.4));
  const titleX = Math.round((dims.w - titleWidth) / 2);
  const titleY = badgeY + badgeHeight + Math.round(dims.h * 0.035);

  const subSize = Math.max(13, Math.round(dims.w * 0.028));
  const subWidth = Math.round(dims.w * 0.66);
  const subHeight = Math.max(Math.round(dims.h * 0.08), Math.round(subSize * 2.4));
  const subX = Math.round((dims.w - subWidth) / 2);
  const subY = titleY + titleHeight + Math.round(dims.h * 0.02);

  return [
    { id: Date.now() + 1, type: 'shape', shape: 'rect', radius: '999px', x: badgeX, y: badgeY, width: badgeWidth, height: badgeHeight, rotation: 0, color: accentColor, boxShadow: shapeShadow, visible: true },
    { id: Date.now() + 2, type: 'text', content: badgeText, x: badgeX, y: badgeY, width: badgeWidth, height: badgeHeight, rotation: 0, size: badgeFontSize, color: textColor, fontWeight: '700', letterSpacing: '0.06em', fontStyle: 'normal', fontFamily: TPL_FONT, textAlign: 'center', textShadow: textShadow, visible: true },
    { id: Date.now() + 3, type: 'text', content: title, x: titleX, y: titleY, width: titleWidth, height: titleHeight, rotation: 0, size: titleSize, color: textColor, fontWeight: '700', fontStyle: 'normal', fontFamily: titleFont, textAlign: 'center', textShadow: textShadow, visible: true },
    subtitle? { id: Date.now() + 4, type: 'text', content: subtitle, x: subX, y: subY, width: subWidth, height: subHeight, rotation: 0, size: subSize, color: textColor, fontWeight: '400', fontStyle: 'normal', fontFamily: TPL_FONT, textAlign: 'center', textShadow: textShadow, visible: true } : null
  ].filter(Boolean);
}

function buildCardLayout(dims, title, subtitle, accentColor, textColor, titleFont, textShadow, shapeShadow) {
  const circleSize = Math.round(dims.w * 0.13);
  const circleX = Math.round((dims.w - circleSize) / 2);
  const circleY = Math.round(dims.h * 0.2);

  const titleSize = Math.max(18, Math.round(dims.w * 0.06));
  const titleWidth = Math.round(dims.w * 0.7);
  const titleHeight = Math.max(Math.round(dims.h * 0.13), Math.round(titleSize * 2.4));
  const titleX = Math.round((dims.w - titleWidth) / 2);
  const titleY = circleY + circleSize + Math.round(dims.h * 0.04);

  const subSize = Math.max(12, Math.round(dims.w * 0.026));
  const subWidth = Math.round(dims.w * 0.6);
  const subHeight = Math.max(Math.round(dims.h * 0.07), Math.round(subSize * 2.4));
  const subX = Math.round((dims.w - subWidth) / 2);
  const subY = titleY + titleHeight + Math.round(dims.h * 0.012);

  return [
    { id: Date.now() + 1, type: 'shape', shape: 'circle', x: circleX, y: circleY, width: circleSize, height: circleSize, rotation: 0, color: accentColor, boxShadow: shapeShadow, visible: true },
    { id: Date.now() + 2, type: 'text', content: title, x: titleX, y: titleY, width: titleWidth, height: titleHeight, rotation: 0, size: titleSize, color: textColor, fontWeight: '700', fontStyle: 'normal', fontFamily: titleFont, textAlign: 'center', textShadow: textShadow, visible: true },

  ].filter(Boolean);
}

function buildBigTypeLayout(dims, title, subtitle, accentColor, textColor, titleFont, textShadow, shapeShadow) {
  const titleSize = Math.max(28, Math.round(Math.min(dims.w, dims.h) * 0.11));
  const titleWidth = Math.round(dims.w * 0.78);
  const titleHeight = Math.max(Math.round(dims.h * 0.34), Math.round(titleSize * 2.8));
  const titleX = Math.round(dims.w * 0.11);
  const titleY = Math.round(dims.h * 0.48);

  const ruleWidth = Math.round(dims.w * 0.18);
  const ruleHeight = Math.max(5, Math.round(dims.h * 0.014));
  const ruleGap = Math.round(dims.h * 0.04);
  const ruleX = titleX;
  const ruleY = Math.max(0, titleY - ruleHeight - ruleGap);

  const subSize = Math.max(14, Math.round(Math.min(dims.w, dims.h) * 0.032));
  const subWidth = Math.round(dims.w * 0.6);
  const subHeight = Math.max(Math.round(dims.h * 0.1), Math.round(subSize * 2.2));
  const subX = titleX;
  const subY = titleY + titleHeight + Math.round(dims.h * 0.025);

  return [
    { id: Date.now() + 1, type: 'shape', shape: 'rect', x: ruleX, y: ruleY, width: ruleWidth, height: ruleHeight, rotation: 0, color: accentColor, boxShadow: shapeShadow, visible: true },
    { id: Date.now() + 2, type: 'text', content: title, x: titleX, y: titleY, width: titleWidth, height: titleHeight, rotation: 0, size: titleSize, color: textColor, fontWeight: '800', fontStyle: 'normal', fontFamily: titleFont, textAlign: 'left', letterSpacing: '-0.02em', lineHeight: '0.95', textShadow: textShadow, visible: true },
    subtitle? { id: Date.now() + 3, type: 'text', content: subtitle, x: subX, y: subY, width: subWidth, height: subHeight, rotation: 0, size: subSize, color: textColor, fontWeight: '400', fontStyle: 'normal', fontFamily: TPL_FONT, textAlign: 'left', opacity: '0.9', textShadow: textShadow, visible: true } : null
  ].filter(Boolean);
}

function buildBannerLayout(dims, title, subtitle, accentColor, textColor, titleFont, textShadow, shapeShadow) {
  const titleSize = Math.max(18, Math.round(Math.min(dims.w * 0.055, dims.h * 0.13)));
  const titleWidth = Math.round(dims.w * 0.82);
  const titleX = Math.round(dims.w * 0.09);
  const titleHeight = Math.max(Math.round(titleSize * 2.1), 32);

  const subSize = Math.max(12, Math.round(Math.min(dims.w * 0.026, dims.h * 0.065)));
  const subWidth = titleWidth;
  const subX = titleX;
  const subHeight = subtitle? Math.max(Math.round(subSize * 2), 22) : 0;

  const padTop = Math.round(dims.h * 0.04);
  const padMid = subtitle? Math.round(dims.h * 0.02) : 0;
  const padBottom = Math.round(dims.h * 0.04);

  const bandHeight = padTop + titleHeight + padMid + subHeight + padBottom;
  const bandY = dims.h - bandHeight;
  const titleY = bandY + padTop;
  const subY = titleY + titleHeight + padMid;

  return [
    { id: Date.now() + 1, type: 'shape', shape: 'rect', radius: '20px 20px 0 0', x: 0, y: bandY, width: dims.w, height: bandHeight, rotation: 0, color: accentColor, boxShadow: shapeShadow, visible: true },
    { id: Date.now() + 2, type: 'text', content: title, x: titleX, y: titleY, width: titleWidth, height: titleHeight, rotation: 0, size: titleSize, color: textColor, fontWeight: '800', fontStyle: 'normal', fontFamily: titleFont, textAlign: 'left', letterSpacing: '-0.01em', textShadow: textShadow, visible: true },
    subtitle? { id: Date.now() + 3, type: 'text', content: subtitle, x: subX, y: subY, width: subWidth, height: subHeight, rotation: 0, size: subSize, color: textColor, fontWeight: '500', fontStyle: 'normal', fontFamily: TPL_FONT, textAlign: 'left', opacity: '0.95', textShadow: textShadow, visible: true } : null
  ].filter(Boolean);
}

function buildSplitLayout(dims, title, subtitle, accentColor, textColor, titleFont, textShadow, shapeShadow) {
  const bandWidth = Math.round(dims.w * 0.4);

  const titleSize = Math.max(15, Math.round(bandWidth * 0.15));
  const titleWidth = Math.round(bandWidth * 0.82);
  const titleX = Math.round(bandWidth * 0.09);
  const titleHeight = Math.max(Math.round(dims.h * 0.22), Math.round(titleSize * 3));
  const titleY = Math.round(dims.h * 0.36);

  const subSize = Math.max(11, Math.round(bandWidth * 0.065));
  const subWidth = titleWidth;
  const subX = titleX;
  const subHeight = Math.max(Math.round(dims.h * 0.1), Math.round(subSize * 2.4));
  const subY = titleY + titleHeight + Math.round(dims.h * 0.02);

  return [
    { id: Date.now() + 1, type: 'shape', shape: 'rect', radius: '0 16px 16px 0', x: 0, y: 0, width: bandWidth, height: dims.h, rotation: 0, color: accentColor, boxShadow: shapeShadow, visible: true },
    { id: Date.now() + 2, type: 'text', content: title, x: titleX, y: titleY, width: titleWidth, height: titleHeight, rotation: 0, size: titleSize, color: textColor, fontWeight: '700', fontStyle: 'normal', fontFamily: titleFont, textAlign: 'left', textShadow: textShadow, visible: true },
    subtitle? { id: Date.now() + 3, type: 'text', content: subtitle, x: subX, y: subY, width: subWidth, height: subHeight, rotation: 0, size: subSize, color: textColor, fontWeight: '400', fontStyle: 'normal', fontFamily: TPL_FONT, textAlign: 'left', textShadow: textShadow, visible: true } : null
  ].filter(Boolean);
}

function buildFrameLayout(dims, title, subtitle, accentColor, textColor, titleFont, textShadow, shapeShadow) {
  const inset = Math.round(Math.min(dims.w, dims.h) * 0.06);
  const thick = Math.max(3, Math.round(Math.min(dims.w, dims.h) * 0.012));

  const titleSize = Math.max(18, Math.round(dims.w * 0.058));
  const titleWidth = Math.round(dims.w * 0.66);
  const titleHeight = Math.max(Math.round(dims.h * 0.16), Math.round(titleSize * 2.4));
  const titleX = Math.round((dims.w - titleWidth) / 2);
  const titleY = Math.round(dims.h * 0.34);

  const subSize = Math.max(12, Math.round(dims.w * 0.026));
  const subWidth = Math.round(dims.w * 0.58);
  const subHeight = Math.max(Math.round(dims.h * 0.09), Math.round(subSize * 2.4));
  const subX = Math.round((dims.w - subWidth) / 2);
  const subY = titleY + titleHeight + Math.round(dims.h * 0.025);

  return [
    { id: Date.now() + 1, type: 'shape', shape: 'rect', radius: '0px', x: inset, y: inset, width: dims.w - inset * 2, height: thick, rotation: 0, color: accentColor, boxShadow: shapeShadow, visible: true },
    { id: Date.now() + 2, type: 'shape', shape: 'rect', radius: '0px', x: inset, y: dims.h - inset - thick, width: dims.w - inset * 2, height: thick, rotation: 0, color: accentColor, boxShadow: shapeShadow, visible: true },
    { id: Date.now() + 3, type: 'shape', shape: 'rect', radius: '0px', x: inset, y: inset, width: thick, height: dims.h - inset * 2, rotation: 0, color: accentColor, boxShadow: shapeShadow, visible: true },
    { id: Date.now() + 4, type: 'shape', shape: 'rect', radius: '0px', x: dims.w - inset - thick, y: inset, width: thick, height: dims.h - inset * 2, rotation: 0, color: accentColor, boxShadow: shapeShadow, visible: true },
    { id: Date.now() + 5, type: 'text', content: title, x: titleX, y: titleY, width: titleWidth, height: titleHeight, rotation: 0, size: titleSize, color: textColor, fontWeight: '700', fontStyle: 'normal', fontFamily: titleFont, textAlign: 'center', textShadow: textShadow, visible: true },
    subtitle? { id: Date.now() + 6, type: 'text', content: subtitle, x: subX, y: subY, width: subWidth, height: subHeight, rotation: 0, size: subSize, color: textColor, fontWeight: '400', fontStyle: 'normal', fontFamily: TPL_FONT, textAlign: 'center', textShadow: textShadow, visible: true } : null
  ].filter(Boolean);
}

function buildLogoLayout(dims, title, subtitle, accentColor, textColor, titleFont, textShadow, shapeShadow) {
  const circleSize = Math.round(dims.w * 0.34);
  const circleX = Math.round((dims.w - circleSize) / 2);
  const circleY = Math.round(dims.h * 0.18);

  const titleSize = Math.max(20, Math.round(dims.w * 0.075));
  const titleWidth = Math.round(dims.w * 0.82);
  const titleHeight = Math.max(Math.round(dims.h * 0.18), Math.round(titleSize * 2.4));
  const titleX = Math.round((dims.w - titleWidth) / 2);
  const titleY = circleY + circleSize + Math.round(dims.h * 0.06);

  return [
    { id: Date.now() + 1, type: 'shape', shape: 'circle', x: circleX, y: circleY, width: circleSize, height: circleSize, rotation: 0, color: accentColor, boxShadow: shapeShadow, visible: true },
    { id: Date.now() + 2, type: 'text', content: title, x: titleX, y: titleY, width: titleWidth, height: titleHeight, rotation: 0, size: titleSize, color: textColor, fontWeight: '700', fontStyle: 'normal', fontFamily: titleFont, textAlign: 'center', letterSpacing: '0.02em', textShadow: textShadow, visible: true }
  ];
}

function buildResumeLayout(dims, title, subtitle, accentColor, textColor, titleFont, textShadow, shapeShadow) {
  const avatarSize = Math.round(dims.w * 0.16);
  const avatarX = Math.round((dims.w - avatarSize) / 2);
  const avatarY = Math.round(dims.h * 0.05);

  const nameSize = Math.max(18, Math.round(dims.w * 0.062));
  const nameWidth = Math.round(dims.w * 0.84);
  const nameHeight = Math.max(Math.round(dims.h * 0.06), Math.round(nameSize * 1.6));
  const nameX = Math.round((dims.w - nameWidth) / 2);
  const nameY = avatarY + avatarSize + Math.round(dims.h * 0.025);

  const roleSize = Math.max(12, Math.round(dims.w * 0.032));
  const roleWidth = nameWidth;
  const roleHeight = Math.max(Math.round(dims.h * 0.035), Math.round(roleSize * 1.6));
  const roleX = nameX;
  const roleY = nameY + nameHeight + Math.round(dims.h * 0.006);

  const ruleWidth = Math.round(dims.w * 0.7);
  const ruleX = Math.round((dims.w - ruleWidth) / 2);
  const ruleHeight = Math.max(2, Math.round(dims.h * 0.003));
  const ruleY = roleY + roleHeight + Math.round(dims.h * 0.03);

  const sectionX = Math.round(dims.w * 0.12);
  const sectionWidth = Math.round(dims.w * 0.76);
  const headingSize = Math.max(11, Math.round(dims.w * 0.026));
  const headingHeight = Math.round(headingSize * 1.8);
  const bodySize = Math.max(10, Math.round(dims.w * 0.022));
  const bodyLineHeight = Math.round(bodySize * 1.7);
  const gapAfterHeading = Math.round(dims.h * 0.012);
  const gapBetweenSections = Math.round(dims.h * 0.028);

  const sections = [
    { heading: 'EXPERIENCIA', lines: ['Empresa Creativa S.A. — 2022 a la fecha', 'Estudio Profesional CR — 2019 a 2022'] },
    { heading: 'EDUCACIÓN', lines: ['Universidad de Costa Rica — Licenciatura'] },
    { heading: 'HABILIDADES', lines: ['Trabajo en equipo, comunicación, liderazgo'] }
  ];

  const elements = [
    { id: Date.now() + 1, type: 'shape', shape: 'circle', x: avatarX, y: avatarY, width: avatarSize, height: avatarSize, rotation: 0, color: accentColor, boxShadow: shapeShadow, visible: true },
    { id: Date.now() + 2, type: 'text', content: title, x: nameX, y: nameY, width: nameWidth, height: nameHeight, rotation: 0, size: nameSize, color: textColor, fontWeight: '700', fontStyle: 'normal', fontFamily: titleFont, textAlign: 'center', textShadow: textShadow, visible: true },
    { id: Date.now() + 3, type: 'text', content: subtitle, x: roleX, y: roleY, width: roleWidth, height: roleHeight, rotation: 0, size: roleSize, color: accentColor, fontWeight: '600', fontStyle: 'normal', fontFamily: TPL_FONT, textAlign: 'center', textShadow: 'none', visible: true },
    { id: Date.now() + 4, type: 'shape', shape: 'rect', radius: '2px', x: ruleX, y: ruleY, width: ruleWidth, height: ruleHeight, rotation: 0, color: accentColor, boxShadow: 'none', visible: true }
  ];

  let cursorY = ruleY + ruleHeight + Math.round(dims.h * 0.035);
  let idSeq = 5;
  sections.forEach(sec => {
    elements.push({ id: Date.now() + idSeq++, type: 'text', content: sec.heading, x: sectionX, y: cursorY, width: sectionWidth, height: headingHeight, rotation: 0, size: headingSize, color: accentColor, fontWeight: '700', fontStyle: 'normal', fontFamily: TPL_FONT, textAlign: 'left', letterSpacing: '0.08em', textShadow: 'none', visible: true });
    cursorY += headingHeight + gapAfterHeading;
    sec.lines.forEach(line => {
      elements.push({ id: Date.now() + idSeq++, type: 'text', content: line, x: sectionX, y: cursorY, width: sectionWidth, height: bodyLineHeight, rotation: 0, size: bodySize, color: textColor, fontWeight: '400', fontStyle: 'normal', fontFamily: TPL_FONT, textAlign: 'left', textShadow: 'none', visible: true });
      cursorY += bodyLineHeight;
    });
    cursorY += gapBetweenSections;
  });

  return elements;
}

const CATEGORY_FONT = {
  invitation: FONT_OPTIONS[1].value,
  certificate: FONT_OPTIONS[1].value,

};

function buildTemplateElements(category, layout, title, subtitle, accentColor, textColor, bgType) {
  const dims = formatDims(category);
  const meta = CATEGORY_META[category] || {};
  const titleFont = CATEGORY_FONT[category] || TPL_FONT;
  const textShadow = (bgType || 'photo') === 'photo'? '2px 2px 6px rgba(0,0,0,0.8)' : 'none';
  const shapeShadow = '0 4px 14px rgba(0,0,0,0.18)';
  if (layout === 'badge') return buildBadgeLayout(dims, title, subtitle, meta.badge || '', accentColor, textColor, titleFont, textShadow, shapeShadow);
  if (layout === 'card') return buildCardLayout(dims, title, subtitle, accentColor, textColor, titleFont, textShadow, shapeShadow);
  if (layout === 'bigType') return buildBigTypeLayout(dims, title, subtitle, accentColor, textColor, titleFont, textShadow, shapeShadow);
  if (layout === 'banner') return buildBannerLayout(dims, title, subtitle, accentColor, textColor, titleFont, textShadow, shapeShadow);
  if (layout === 'split') return buildSplitLayout(dims, title, subtitle, accentColor, textColor, titleFont, textShadow, shapeShadow);
  if (layout === 'frame') return buildFrameLayout(dims, title, subtitle, accentColor, textColor, titleFont, textShadow, shapeShadow);
  if (layout === 'logo') return buildLogoLayout(dims, title, subtitle, accentColor, textColor, titleFont, textShadow, shapeShadow);
  if (layout === 'resumeDoc') return buildResumeLayout(dims, title, subtitle, accentColor, textColor, titleFont, textShadow, shapeShadow);
  return buildCenteredLayout(dims, title, subtitle, accentColor, textColor, titleFont, textShadow, shapeShadow);
}

function matchesFilter(tpl, query) {
  if (!query) return true;
  const q = query.toLowerCase();
  const label = (CATEGORY_META[tpl.category]? CATEGORY_META[tpl.category].label : '').toLowerCase();
  return tpl.category.toLowerCase().includes(q) || label.includes(q) || tpl.title.toLowerCase().includes(q);
}

function aspectClass(category) {
  const format = (CATEGORY_META[category] && CATEGORY_META[category].format) || 'square';
  if (format === 'story') return 'h-72';
  if (format === 'portrait') return 'h-60';
  if (format === 'wide') return 'h-44';
  if (format === 'card') return 'h-36';
  if (format === 'cover') return 'h-32';
  if (format === 'webHero') return 'h-32';
  if (format === 'tshirtFmt') return 'h-52';
  if (format === 'mugFmt') return 'h-28';
  return 'h-48';
}

function TemplateThumb({ tpl }) {
  const cls = `w-full ${aspectClass(tpl.category)}`;
  if ((tpl.bgType || 'photo') === 'photo') {
    return React.createElement('img', { src: tpl.thumb, className: `${cls} object-cover` });
  }
  return React.createElement('div', { className: `${cls} relative`, style: { background: tpl.thumb } },
    React.createElement('div', {
      className: "absolute bottom-3 left-3 w-6 h-6 rounded-full",
      style: { background: tpl.accent }
    })
  );
}

function rotateVector(dx, dy, deg) {
  const rad = deg * Math.PI / 180;
  return {
    x: dx * Math.cos(rad) - dy * Math.sin(rad),
    y: dx * Math.sin(rad) + dy * Math.cos(rad)
  };
}

function angleBetween(cx, cy, px, py) {
  return Math.atan2(py - cy, px - cx) * 180 / Math.PI;
}

function computeResize(handle, start, dx, dy) {
  const MIN = 24;
  let x = start.x, y = start.y, width = start.width, height = start.height;
  if (handle.includes('e')) width = Math.max(MIN, start.width + dx);
  if (handle.includes('w')) { width = Math.max(MIN, start.width - dx); x = start.x + start.width - width; }
  if (handle.includes('s')) height = Math.max(MIN, start.height + dy);
  if (handle.includes('n')) { height = Math.max(MIN, start.height - dy); y = start.y + start.height - height; }
  return { x, y, width, height };
}
