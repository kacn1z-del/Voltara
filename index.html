<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voltara v12</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');
* { font-family: 'Inter', sans-serif; }
.font-display { font-family: 'Space Grotesk', sans-serif; }
</style>
</head>
<body class="bg-zinc-950 text-white">
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

function App() {
  const [active, setActive] = useState('home');
  const [sidebarOpen, setSidebarOpen] = useState(false);

  const menu = [
    { id: 'home', icon: 'fa-home', label: 'Inicio' },
    { id: 'library', icon: 'fa-layer-group', label: 'Biblioteca' },
    { id: 'editor', icon: 'fa-pen-ruler', label: 'Editor' },
    { id: 'creative', icon: 'fa-wand-magic-sparkles', label: 'IA Creativa' },
    { id: 'smart', icon: 'fa-robot', label: 'Smart Designer' },
    { id: 'flipbook', icon: 'fa-book', label: 'Flipbook' },
    { id: 'translator', icon: 'fa-language', label: 'Traductor' },
  ];

  return (
    <div className="flex h-screen bg-zinc-950 overflow-hidden">
      {/* Sidebar - Responsive */}
      <div className={`${sidebarOpen ? 'translate-x-0' : '-translate-x-full'} lg:translate-x-0 fixed lg:relative z-50 w-72 h-full border-r border-zinc-800 bg-zinc-900 transition-transform duration-300 flex flex-col`}>
        <div className="p-5 flex items-center gap-3 border-b border-zinc-800">
          <div className="w-10 h-10 bg-gradient-to-br from-violet-600 to-fuchsia-500 rounded-2xl flex items-center justify-center">
            <i className="fas fa-bolt text-white text-2xl"></i>
          </div>
          <div className="font-display text-3xl font-semibold">Voltara <span className="text-sm font-medium bg-violet-600 px-2 py-0.5 rounded-full">v12</span></div>
          <button onClick={() => setSidebarOpen(false)} className="lg:hidden ml-auto text-2xl">✕</button>
        </div>

        <div className="flex-1 overflow-y-auto p-3">
          {menu.map(item => (
            <button
              key={item.id}
              onClick={() => { setActive(item.id); setSidebarOpen(false); }}
              className={`w-full flex items-center gap-3.5 px-4 py-3.5 rounded-2xl mb-1 transition-all ${active === item.id ? 'bg-violet-600 text-white' : 'hover:bg-zinc-800 text-zinc-300'}`}
            >
              <i className={`fas ${item.icon} w-5`}></i>
              <span>{item.label}</span>
            </button>
          ))}
        </div>
      </div>

      {/* Main Area */}
      <div className="flex-1 flex flex-col min-w-0">
        {/* Top Navigation */}
        <div className="h-14 border-b border-zinc-800 bg-zinc-900 px-4 lg:px-6 flex items-center justify-between">
          <div className="flex items-center gap-4">
            <button onClick={() => setSidebarOpen(true)} className="lg:hidden text-2xl p-2">
              <i className="fas fa-bars"></i>
            </button>
            <div className="font-display text-2xl font-semibold lg:hidden">Voltara</div>
          </div>

          <div className="flex items-center gap-3">
            <select className="bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-2 text-sm hidden sm:block">
              <option>Español (Latinoamérica)</option>
            </select>
            <button className="bg-white text-black px-5 py-2 rounded-2xl font-semibold flex items-center gap-2 text-sm lg:text-base">
              <i className="fas fa-plus"></i> Nuevo
            </button>
          </div>
        </div>

        {/* Search Bar */}
        <div className="p-4 lg:p-6 border-b border-zinc-800 bg-zinc-900">
          <div className="max-w-4xl mx-auto flex flex-col sm:flex-row gap-3">
            <div className="flex-1 relative">
              <i className="fas fa-search absolute left-4 top-4 text-zinc-500"></i>
              <input type="text" placeholder="Buscar plantillas..." 
                className="w-full bg-zinc-800 border border-zinc-700 rounded-3xl py-4 pl-12 text-base focus:outline-none focus:border-violet-500" />
            </div>
            <button className="bg-gradient-to-r from-violet-600 to-fuchsia-600 px-8 py-4 rounded-3xl font-semibold flex items-center justify-center gap-2 hover:brightness-110 transition">
              <i className="fas fa-wand-magic-sparkles"></i>
              <span className="hidden sm:inline">Generar con IA</span>
            </button>
          </div>
        </div>

        {/* Content Area */}
        <div className="flex-1 overflow-auto p-4 lg:p-8">
          {active === 'home' && (
            <>
              <h1 className="text-3xl lg:text-4xl font-semibold mb-2">Bienvenido a Voltara v12</h1>
              <p className="text-zinc-400 mb-8">Crea diseños impresionantes con IA</p>

              <h2 className="text-xl font-semibold mb-6 flex items-center gap-2">
                🔥 Recientes
              </h2>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                {["Pitch Deck Moderno", "Reporte Anual", "Post Instagram", "Historia Facebook", "Portafolio Creativo"].map((title, i) => (
                  <div key={i} className="bg-zinc-900 rounded-3xl overflow-hidden border border-zinc-800 hover:border-violet-500 transition group">
                    <img src={`https://picsum.photos/id/${80+i}/600/340`} className="w-full h-44 object-cover" alt={title} />
                    <div className="p-4">
                      <p className="font-semibold">{title}</p>
                      <p className="text-xs text-zinc-500">1080 × 1080 px</p>
                    </div>
                  </div>
                ))}
              </div>
            </>
          )}

          {active !== 'home' && (
            <div className="flex items-center justify-center h-full text-center">
              <div>
                <h2 className="text-4xl mb-4">🚧 {active === 'library' ? 'Biblioteca' : 
                  active === 'editor' ? 'Editor' : 
                  active === 'creative' ? 'IA Creativa' : 
                  active === 'smart' ? 'Smart Designer' : 
                  active === 'flipbook' ? 'Flipbook' : 'Módulo'}</h2>
                <p className="text-zinc-400">Esta sección está lista para desarrollar</p>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
