<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voltara v12</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');
* { font-family: 'Inter', sans-serif; }
.font-display { font-family: 'Space Grotesk', sans-serif; }
.canvas-container { background-size: cover; background-position: center; }
</style>
</head>
<body class="bg-zinc-950 text-white">
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useEffect } = React;

const TEMPLATES = [
  { id: 1, category: "infographic", title: "Infografía Datos", thumb: "https://picsum.photos/id/1015/800/600", bg: "https://picsum.photos/id/1015/1200/800" },
  { id: 2, category: "nature", title: "Bosque Místico", thumb: "https://picsum.photos/id/1016/800/600", bg: "https://picsum.photos/id/1016/1200/800" },
  { id: 3, category: "presentations", title: "Pitch Deck Moderno", thumb: "https://picsum.photos/id/201/800/600", bg: "https://picsum.photos/id/201/1200/800" },
  { id: 4, category: "social", title: "Post Instagram", thumb: "https://picsum.photos/id/237/800/600", bg: "https://picsum.photos/id/237/1200/800" },
  { id: 5, category: "marketing", title: "Flyer Promocional", thumb: "https://picsum.photos/id/870/800/600", bg: "https://picsum.photos/id/870/1200/800" },
];

function App() {
  const [active, setActive] = useState('home');
  const [selectedTemplate, setSelectedTemplate] = useState(null);
  const [elements, setElements] = useState([]);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [selectedElementId, setSelectedElementId] = useState(null);

  const openTemplate = (tpl) => {
    setSelectedTemplate(tpl);
    setActive('editor');
    setElements([{
      id: Date.now(),
      type: 'text',
      content: tpl.title,
      x: 100,
      y: 150,
      size: 42,
      color: '#ffffff'
    }]);
  };

  const addText = () => {
    const newEl = {
      id: Date.now(),
      type: 'text',
      content: 'Nuevo texto',
      x: 150,
      y: 200,
      size: 28,
      color: '#ffffff'
    };
    setElements([...elements, newEl]);
    setSelectedElementId(newEl.id);
  };

  const updateElement = (id, updates) => {
    setElements(elements.map(el => el.id === id ? {...el, ...updates} : el));
  };

  return (
    <div className="flex h-screen bg-zinc-950 overflow-hidden">
      {/* Sidebar */}
      <div className={`${sidebarOpen ? 'translate-x-0' : '-translate-x-full'} lg:translate-x-0 fixed lg:static z-50 w-72 h-full bg-zinc-900 border-r border-zinc-800 transition-transform flex flex-col`}>
        <div className="p-5 flex items-center gap-3 border-b border-zinc-800">
          <div className="w-10 h-10 bg-gradient-to-br from-violet-600 to-fuchsia-500 rounded-2xl flex items-center justify-center">
            <i className="fas fa-bolt text-white text-2xl"></i>
          </div>
          <div className="font-display text-3xl font-semibold">Voltara <span className="text-sm bg-violet-600 px-2 py-0.5 rounded-full">v12</span></div>
        </div>

        <div className="flex-1 overflow-y-auto p-3">
          {[
            {id:'home', icon:'fa-home', label:'Inicio'},
            {id:'library', icon:'fa-layer-group', label:'Biblioteca'},
            {id:'editor', icon:'fa-pen-ruler', label:'Editor'},
            {id:'creative', icon:'fa-wand-magic-sparkles', label:'IA Creativa'},
          ].map(item => (
            <button key={item.id} onClick={() => {setActive(item.id); setSidebarOpen(false);}}
              className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl mb-1 ${active === item.id ? 'bg-violet-600 text-white' : 'hover:bg-zinc-800 text-zinc-300'}`}>
              <i className={`fas ${item.icon}`}></i>
              <span>{item.label}</span>
            </button>
          ))}
        </div>
      </div>

      {/* Main Area */}
      <div className="flex-1 flex flex-col">
        {/* Top Bar */}
        <div className="h-14 border-b border-zinc-800 bg-zinc-900 px-4 flex items-center justify-between">
          <button onClick={() => setSidebarOpen(!sidebarOpen)} className="lg:hidden text-2xl"><i className="fas fa-bars"></i></button>
          <div className="font-display text-2xl font-semibold lg:hidden">Voltara</div>
        </div>

        {/* Content */}
        <div className="flex-1 overflow-auto">
          {active === 'library' && (
            <div className="p-6">
              <h2 className="text-3xl font-semibold mb-8">Plantillas</h2>
              <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                {TEMPLATES.map(tpl => (
                  <div key={tpl.id} onClick={() => openTemplate(tpl)}
                    className="cursor-pointer bg-zinc-900 rounded-3xl overflow-hidden border border-zinc-800 hover:border-violet-500 transition group">
                    <img src={tpl.thumb} className="w-full h-52 object-cover" />
                    <div className="p-4">
                      <p className="font-semibold">{tpl.title}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {active === 'editor' && selectedTemplate && (
            <div className="h-full relative">
              {/* Canvas con fondo de plantilla */}
              <div 
                className="canvas-container w-full h-full relative overflow-hidden"
                style={{ backgroundImage: `url(${selectedTemplate.bg})` }}
              >
                {elements.map(el => (
                  <div
                    key={el.id}
                    className={`absolute cursor-move p-3 rounded-lg border-2 ${selectedElementId === el.id ? 'border-violet-500' : 'border-transparent hover:border-white/50'}`}
                    style={{
                      left: el.x + 'px',
                      top: el.y + 'px',
                      color: el.color,
                      fontSize: el.size + 'px',
                      fontWeight: 'bold',
                      textShadow: '0 2px 4px rgba(0,0,0,0.7)'
                    }}
                    onClick={() => setSelectedElementId(el.id)}
                  >
                    {el.content}
                  </div>
                ))}
              </div>

              {/* Toolbar */}
              <div className="absolute top-4 left-1/2 -translate-x-1/2 bg-zinc-900/90 backdrop-blur-md border border-zinc-700 rounded-2xl px-6 py-3 flex gap-4 z-10">
                <button onClick={addText} className="flex items-center gap-2 px-5 py-2 hover:bg-zinc-800 rounded-xl">
                  <i className="fas fa-font"></i> Texto
                </button>
                <button className="flex items-center gap-2 px-5 py-2 hover:bg-zinc-800 rounded-xl">
                  <i className="fas fa-image"></i> Imagen
                </button>
                <button className="flex items-center gap-2 px-5 py-2 hover:bg-zinc-800 rounded-xl">
                  <i className="fas fa-shapes"></i> Forma
                </button>
              </div>

              {selectedElementId && (
                <div className="absolute bottom-6 left-1/2 -translate-x-1/2 bg-zinc-900 border border-zinc-700 rounded-2xl p-4 flex gap-4">
                  <input 
                    type="color" 
                    value={elements.find(e => e.id === selectedElementId)?.color || '#ffffff'}
                    onChange={(e) => {
                      updateElement(selectedElementId, {color: e.target.value});
                    }}
                    className="w-12 h-10 bg-transparent border-0 cursor-pointer"
                  />
                  <input 
                    type="range" 
                    min="12" 
                    max="80" 
                    value={elements.find(e => e.id === selectedElementId)?.size || 24}
                    onChange={(e) => updateElement(selectedElementId, {size: parseInt(e.target.value)})}
                    className="w-40"
                  />
                </div>
              )}
            </div>
          )}

          {active === 'home' && (
            <div className="p-8">
              <h1 className="text-4xl font-semibold mb-8">Bienvenido a Voltara v12</h1>
              <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                {TEMPLATES.map(t => (
                  <div key={t.id} onClick={() => openTemplate(t)} className="cursor-pointer bg-zinc-900 rounded-3xl overflow-hidden border border-zinc-800 hover:border-violet-500">
                    <img src={t.thumb} className="w-full h-48 object-cover" />
                    <div className="p-4">
                      <p className="font-semibold">{t.title}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
