<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voltara v12</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');
* { font-family: 'Inter', sans-serif; }
.font-display { font-family: 'Space Grotesk', sans-serif; }
</style>
</head>
<body class="bg-zinc-950 text-white">
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

function App() {
  const [active, setActive] = useState('home');

  const menu = [
    { id: 'home', icon: 'fa-home', label: 'Inicio' },
    { id: 'library', icon: 'fa-layer-group', label: 'Biblioteca' },
    { id: 'editor', icon: 'fa-pen-ruler', label: 'Editor' },
    { id: 'creative', icon: 'fa-wand-magic-sparkles', label: 'IA Creativa' },
    { id: 'smart', icon: 'fa-robot', label: 'Smart Designer 2.0' },
    { id: 'design', icon: 'fa-palette', label: 'Diseño' },
    { id: 'flipbook', icon: 'fa-book', label: 'Flipbook' },
    { id: 'translator', icon: 'fa-language', label: 'Traductor' },
  ];

  return (
    <div className="flex h-screen bg-zinc-950 overflow-hidden">
      {/* Sidebar estilo Canva */}
      <div className="w-72 border-r border-zinc-800 bg-zinc-900 flex flex-col">
        <div className="p-5 flex items-center gap-3 border-b border-zinc-800">
          <div className="w-10 h-10 bg-gradient-to-br from-violet-600 to-fuchsia-500 rounded-2xl flex items-center justify-center shadow-lg">
            <i className="fas fa-bolt text-white text-2xl"></i>
          </div>
          <div className="font-display text-3xl font-semibold tracking-tighter">Voltara</div>
          <div className="text-xs px-3 py-1 bg-violet-600 text-white rounded-full font-medium">v12</div>
        </div>

        <div className="flex-1 overflow-y-auto py-3 px-3">
          {menu.map(item => (
            <button
              key={item.id}
              onClick={() => setActive(item.id)}
              className={`w-full flex items-center gap-3.5 px-4 py-3.5 rounded-2xl mb-1 text-left transition-all ${active === item.id ? 'bg-zinc-800 text-white' : 'hover:bg-zinc-800/70 text-zinc-300'}`}
            >
              <i className={`fas ${item.icon} w-5 text-lg`}></i>
              <span className="font-medium">{item.label}</span>
            </button>
          ))}
        </div>
      </div>

      {/* Contenido Principal */}
      <div className="flex-1 flex flex-col">
        {/* Barra superior */}
        <div className="h-14 border-b border-zinc-800 bg-zinc-900 px-6 flex items-center justify-between">
          <div className="flex items-center gap-6">
            <select className="bg-zinc-800 text-sm border border-zinc-700 rounded-xl px-4 py-2">
              <option>Español (Latinoamérica)</option>
            </select>
          </div>
          <div className="flex items-center gap-4">
            <button className="flex items-center gap-2 px-5 py-2 bg-white text-black rounded-2xl font-semibold hover:bg-zinc-100">
              <i className="fas fa-plus"></i> Nuevo diseño
            </button>
          </div>
        </div>

        {/* Buscador + Botón IA */}
        <div className="p-6 border-b border-zinc-800 bg-zinc-900">
          <div className="max-w-5xl mx-auto flex gap-4">
            <div className="flex-1 relative">
              <i className="fas fa-search absolute left-5 top-4 text-zinc-500"></i>
              <input 
                type="text" 
                placeholder="Buscar plantillas..." 
                className="w-full bg-zinc-800 border border-zinc-700 rounded-3xl py-4 pl-12 pr-6 text-lg focus:outline-none focus:border-violet-500"
              />
            </div>
            <button className="px-10 bg-gradient-to-r from-violet-600 to-purple-600 rounded-3xl font-semibold text-lg flex items-center gap-3 hover:brightness-110 transition">
              <i className="fas fa-wand-magic-sparkles"></i>
              Generar con IA
            </button>
          </div>
        </div>

        {/* Área de contenido */}
        <div className="flex-1 overflow-auto p-8">
          <h2 className="text-3xl font-semibold mb-8 flex items-center gap-3">
            <span className="text-orange-500">🔥</span> Recientes
          </h2>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            {[
              { title: "Pitch Deck Moderno", img: "https://picsum.photos/id/1015/600/380" },
              { title: "Reporte Anual", img: "https://picsum.photos/id/201/600/380" },
              { title: "Post Instagram", img: "https://picsum.photos/id/237/600/380" },
              { title: "Historia Facebook", img: "https://picsum.photos/id/669/600/380" },
              { title: "Portafolio Creativo", img: "https://picsum.photos/id/870/600/380" },
            ].map((item, i) => (
              <div key={i} className="group bg-zinc-900 rounded-3xl overflow-hidden border border-zinc-800 hover:border-violet-500 hover:shadow-2xl transition-all cursor-pointer">
                <img src={item.img} className="w-full h-48 object-cover" />
                <div className="p-5">
                  <p className="font-semibold text-lg mb-1">{item.title}</p>
                  <p className="text-zinc-500 text-sm">1080 × 1080 px</p>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
